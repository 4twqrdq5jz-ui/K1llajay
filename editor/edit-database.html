<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Catelog Database</title>
  <link rel="icon" href="images/favicon.ico">
  <script src="device-optimization.js"></script>
  <script src="anti-lag-optimization.js"></script>
  <style>
    @font-face {
      font-family: 'sitefont';
      src: url('beyoncefont.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      font-family: 'sitefont', monospace;
      background-color: black;
      color: white;
      text-transform: uppercase;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
    }
    .topbar {
      display: none;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 15px;
      background-color: black;
      border-bottom: 1px solid #333;
      width: 100%;
      height: 50px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1001;
      box-sizing: border-box;
    }
    .hamburger { font-size: 24px; cursor: pointer; margin-right: 10px; }
    .top-name { font-size: 18px; text-transform: uppercase; flex: 1; text-align: center; letter-spacing: 1px; }
    .sidebar {
      width: 260px;
      height: 100dvh;
      padding: 24px;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255,255,255,0.15);
      z-index: 3000;
    }
    .profile-img {
      width: 120px; height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 2px solid #fff;
    }
    .name {
      font-size: 24px;
      margin-bottom: 40px;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .button {
      padding: 10px;
      text-align: center;
      text-decoration: none;
      color: white;
      font-size: 13px;
      letter-spacing: 2px;
      border: 1px solid rgba(255,255,255,0.4);
      transition: 0.3s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      border-radius: inherit;
      z-index: -1;
      transition: background 0.2s ease;
    }
    .button:hover::before { background: rgba(0, 0, 0, 0.3); }
    .button:hover { border-color: white; }
    .footer {
      margin-top: auto;
      font-size: 10px;
      opacity: 0.7;
      text-align: center;
    }
    .footer a { color: white; text-decoration: none; }
    .footer a:hover { opacity: 0.5; }
    .copyright { font-size: 8px; margin-top: 5px; width: 100%; }

    .main {
      margin-left: 260px;
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      height: 100vh;
    }
    .main::-webkit-scrollbar { display: none; }
    .main { -ms-overflow-style: none; scrollbar-width: none; }
    .main h1 { font-size: 28px; margin: 0 0 24px 0; letter-spacing: 1px; }

    .upload-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 800px;
      box-sizing: border-box;
    }
    .upload-section { margin-bottom: 28px; }
    .upload-section h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    #songTitle { grid-column: 1 / -1; }

    input, select {
      background: transparent;
      border: 1px solid #444;
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-family: 'beyoncefont', monospace;
      font-size: 14px;
      box-sizing: border-box;
      text-transform: uppercase;
    }
    input::placeholder { color: #777; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .checkbox-row input[type="checkbox"] { accent-color: #00ff99; }

    .primary-btn {
      background: #00ff99;
      border: none;
      color: #000;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      margin: 12px 0;
      font-family: 'beyoncefont', monospace;
      text-transform: uppercase;
    }
    .primary-btn:hover { background: #00cc77; }

    /* ===== TRACK LIST UI ===== */
    #trackListSection {
      display: none;
      margin-top: 20px;
      border-top: 1px solid #333;
      padding-top: 20px;
    }
    #trackListSection.visible { display: block; }

    .track-row {
      display: grid;
      grid-template-columns: 70px 1fr 1fr 40px;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .track-row input {
      padding: 10px;
      font-size: 13px;
    }
    .track-row .track-num {
      text-align: center;
      background: #1a1a1a;
    }
    .remove-track-btn {
      background: #333;
      border: 1px solid #555;
      color: #ff6666;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remove-track-btn:hover { background: #444; border-color: #ff6666; }

    .add-track-btn {
      background: #222;
      border: 1px dashed #555;
      color: #00ff99;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 1px;
      margin-top: 8px;
      width: 100%;
      text-transform: uppercase;
    }
    .add-track-btn:hover {
      border-color: #00ff99;
      background: #1a1a1a;
    }

    #musicDatabase {
      margin-top: 40px;
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .section-title {
      grid-column: 1 / -1;
      font-size: 18px;
      letter-spacing: 4px;
      opacity: 0.85;
      margin: 10px 0;
    }
    .section-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-header button {
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      padding: 6px 10px;
      cursor: pointer;
      color: white;
      background: #333;
      border: 1px solid #555;
      border-radius: 4px;
    }
    .section-header button:hover { background: #444; }
    .entry {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 14px;
      text-align: center;
    }
    .entry h2 { font-size: 16px; margin: 0 0 8px 0; }
    .entry p { font-size: 12px; opacity: 0.8; margin: 3px 0; }
    .edit-btn {
      background: #333; border: 1px solid #555; color: white; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 10px;
    }
    .edit-btn:hover { background: #444; }

    @media (max-width: 768px) {
      body { flex-direction: column; padding-top: 50px; }
      .topbar {
        display: flex;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 50px;
        padding: 0 15px;
        padding-top: max(0px, env(safe-area-inset-top));
        align-items: center;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.15);
        z-index: 2101;
      }
      .hamburger { font-size: 28px; cursor: pointer; padding: 5px; }
      .top-name { margin: 0 auto; font-size: 16px; letter-spacing: 2px; }
      .sidebar {
        display: none;
        position: fixed;
        top: 50px; left: 0;
        width: 100%;
        height: calc(100dvh - 50px);
        padding: 15px;
        z-index: 1900;
        background: black;
        border-right: none;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .sidebar.active { display: flex; }
      .main {
        margin-left: 0;
        margin-top: 50px;
        padding: 15px;
        width: 100%;
        height: auto;
        min-height: calc(100dvh - 50px);
        padding-bottom: max(40px, calc(15px + env(safe-area-inset-bottom)));
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .form-grid { grid-template-columns: 1fr; }
      .track-row { grid-template-columns: 60px 1fr 1fr 36px; gap: 6px; }
      #musicDatabase { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDf2Caujz2FQuUDtzDr8eArpmaHXX_vsVY",
      authDomain: "music-database-3ee0a.firebaseapp.com",
      databaseURL: "https://music-database-3ee0a-default-rtdb.firebaseio.com",
      projectId: "music-database-3ee0a",
      storageBucket: "music-database-3ee0a.firebasestorage.app",
      messagingSenderId: "148257189959",
      appId: "1:148257189959:web:3e52404367191d5835c162"
    };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('musicDatabase');

    let entries = [];
    let keys = [];
    let editing = null;
    let showAllReleased = false;
    let showAllUnreleased = false;

    /* ---------- Track list UI helpers ---------- */
    function createTrackRow(num = '', title = '', isrc = '') {
      const row = document.createElement('div');
      row.className = 'track-row';
      row.innerHTML = `
        <input type="number" class="track-num" min="1" max="50" value="${num}" placeholder="#" />
        <input type="text" class="track-title" value="${title}" placeholder="Track Name" />
        <input type="text" class="track-isrc" value="${isrc}" placeholder="ISRC (optional)" />
        <button type="button" class="remove-track-btn" title="Remove">−</button>
      `;
      row.querySelector('.remove-track-btn').onclick = () => {
        row.remove();
        renumberTracks();
      };
      return row;
    }

    function renumberTracks() {
      const rows = document.querySelectorAll('#trackRows .track-row');
      rows.forEach((row, i) => {
        const numInput = row.querySelector('.track-num');
        if (!numInput.value) numInput.value = i + 1;
      });
    }

    function getTrackCountFromSelect() {
      return parseInt(document.getElementById('tracks').value, 10) || 1;
    }

    function updateTrackListVisibility() {
      const count = getTrackCountFromSelect();
      const section = document.getElementById('trackListSection');
      const rowsContainer = document.getElementById('trackRows');

      if (count >= 2) {
        section.classList.add('visible');

        // Auto-create missing rows up to the selected count
        const currentRows = rowsContainer.querySelectorAll('.track-row').length;
        for (let i = currentRows; i < count; i++) {
          rowsContainer.appendChild(createTrackRow(i + 1, '', ''));
        }
      } else {
        section.classList.remove('visible');
        // Keep the rows in DOM but hidden – they will be ignored on save
      }
    }

    function collectTracklist() {
      const count = getTrackCountFromSelect();
      if (count < 2) return null;

      const rows = document.querySelectorAll('#trackRows .track-row');
      const list = [];
      rows.forEach(row => {
        const num = parseInt(row.querySelector('.track-num').value, 10) || list.length + 1;
        const title = row.querySelector('.track-title').value.trim();
        const isrc = row.querySelector('.track-isrc').value.trim();
        if (title || isrc) {
          list.push({ number: num, title: title || null, isrc: isrc || null });
        }
      });
      return list.length ? list : null;
    }

    function populateTracklist(tracklist) {
      const rowsContainer = document.getElementById('trackRows');
      rowsContainer.innerHTML = '';
      if (Array.isArray(tracklist) && tracklist.length) {
        tracklist.forEach(t => {
          rowsContainer.appendChild(createTrackRow(
            t.number || t.track || '',
            t.title || t.name || '',
            t.isrc || ''
          ));
        });
      }
      updateTrackListVisibility();
    }

    /* ---------- Date helper ---------- */
    function formatDateMMDDYYYY(dateValue) {
      if (!dateValue) return '';
      const date = new Date(dateValue);
      if (isNaN(date)) return dateValue;
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const year = date.getFullYear();
      return `${month}/${day}/${year}`;
    }

    /* ---------- Render database list ---------- */
    function render() {
      const container = document.getElementById('musicDatabase');
      container.innerHTML = '';

      const released = entries.filter(e => !e.unreleased);
      const unreleased = entries.filter(e => e.unreleased);

      const sortByDate = (a, b) => {
        const da = a.releaseDate ? new Date(a.releaseDate) : 0;
        const db = b.releaseDate ? new Date(b.releaseDate) : 0;
        return da - db;
      };
      released.sort(sortByDate);
      unreleased.sort(sortByDate);

      const releasedToShow = showAllReleased ? released : released.slice(-3).reverse();
      const unreleasedToShow = (showAllUnreleased || unreleased.length < 4)
        ? unreleased
        : unreleased.slice(-3).reverse();

      if (released.length) {
        container.innerHTML += `
          <div class="section-header">
            <div class="section-title">RELEASED</div>
            <button onclick="toggleReleased()">${showAllReleased ? 'Hide All' : 'Show All'}</button>
          </div>
        `;
        releasedToShow.forEach(e => {
          const actualIndex = entries.indexOf(e);
          container.innerHTML += `
            <div class="entry">
              <h2>${e.title} — ${e.artist}</h2>
              ${e.releaseDate ? `<p>DATE: ${formatDateMMDDYYYY(e.releaseDate)}</p>` : ''}
              ${e.upc ? `<p>UPC: ${e.upc}</p>` : ''}
              ${e.isrc ? `<p>ISRC: ${e.isrc}</p>` : ''}
              <p>Tracks: ${e.tracks || '—'}</p>
              <button onclick="edit(${actualIndex})" class="edit-btn">Edit</button>
            </div>`;
        });
      }

      if (unreleased.length) {
        const showBtn = unreleased.length >= 4;
        container.innerHTML += `
          <div class="section-header">
            <div class="section-title">UNRELEASED</div>
            ${showBtn ? `<button onclick="toggleUnreleased()">${showAllUnreleased ? 'Hide All' : 'Show All'}</button>` : ''}
          </div>
        `;
        unreleasedToShow.forEach(e => {
          const actualIndex = entries.indexOf(e);
          container.innerHTML += `
            <div class="entry">
              <h2>${e.title} — ${e.artist} <span style="color:#ff0">(Unreleased)</span></h2>
              ${e.releaseDate ? `<p>DATE: ${formatDateMMDDYYYY(e.releaseDate)}</p>` : ''}
              ${e.upc ? `<p>UPC: ${e.upc}</p>` : ''}
              ${e.isrc ? `<p>ISRC: ${e.isrc}</p>` : ''}
              <p>Tracks: ${e.tracks || '—'}</p>
              <button onclick="edit(${actualIndex})" class="edit-btn">Edit</button>
            </div>`;
        });
      }
    }

    function toggleReleased() {
      showAllReleased = !showAllReleased;
      render();
    }
    function toggleUnreleased() {
      showAllUnreleased = !showAllUnreleased;
      render();
    }

    /* ---------- Save / Edit / Reset ---------- */
    function save() {
      const title = document.getElementById('songTitle').value.trim();
      const artist = document.getElementById('artistName').value.trim() || 'Jae Laurent';
      const upc = document.getElementById('upc').value.trim();
      const isrc = document.getElementById('isrc').value.trim();
      const tracks = document.getElementById('tracks').value;
      const unreleased = document.getElementById('unreleased').checked;
      const releaseDate = document.getElementById('releaseDate').value;

      if (!title) return alert('Title required');

      const data = {
        title,
        artist,
        upc,
        isrc,
        tracks,
        unreleased,
        releaseDate
      };

      // Attach structured tracklist when 2+ tracks
      const tracklist = collectTracklist();
      if (tracklist) {
        data.tracklist = tracklist;
      }

      if (editing !== null) {
        dbRef.child(keys[editing]).set(data).then(reset);
      } else {
        dbRef.push(data);
        reset();
      }
    }

    window.edit = i => {
      const e = entries[i];
      document.getElementById('songTitle').value = e.title || '';
      document.getElementById('artistName').value = e.artist || '';
      document.getElementById('upc').value = e.upc || '';
      document.getElementById('isrc').value = e.isrc || '';
      document.getElementById('releaseDate').value = e.releaseDate || '';
      document.getElementById('tracks').value = e.tracks || '1';
      document.getElementById('unreleased').checked = !!e.unreleased;

      // Load existing tracklist if present
      populateTracklist(e.tracklist || e.tracksArray || e.trackList || null);

      editing = i;
      document.getElementById('addUpdateBtn').textContent = 'Update Entry';
      updateTrackListVisibility();
    };

    function reset() {
      document.getElementById('songTitle').value = '';
      document.getElementById('artistName').value = '';
      document.getElementById('upc').value = '';
      document.getElementById('isrc').value = '';
      document.getElementById('releaseDate').value = '';
      document.getElementById('tracks').value = '1';
      document.getElementById('unreleased').checked = false;
      document.getElementById('trackRows').innerHTML = '';
      document.getElementById('trackListSection').classList.remove('visible');
      editing = null;
      document.getElementById('addUpdateBtn').textContent = 'Add to Database';
    }

    /* ---------- Event listeners ---------- */
    document.getElementById('tracks').addEventListener('change', updateTrackListVisibility);

    document.getElementById('addTrackBtn').addEventListener('click', () => {
      const rows = document.querySelectorAll('#trackRows .track-row').length;
      document.getElementById('trackRows').appendChild(createTrackRow(rows + 1, '', ''));
    });

    document.getElementById('addUpdateBtn').onclick = save;

    document.querySelector('.hamburger').onclick = () => {
      document.querySelector('.sidebar').classList.toggle('active');
    };

    // Initial load
    dbRef.on('value', snap => {
      const val = snap.val() || {};
      entries = Object.values(val);
      keys = Object.keys(val);
      render();
    });

    // Start with correct visibility
    updateTrackListVisibility();
  </script>
</body>
