<!-- New editor page: edit-sos_editor.html (based on edit-database_editor.html styles) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Album Editor</title>
  <link rel="icon" href="images/favicon.ico">
  <script src="device-optimization.js"></script>
  <script src="anti-lag-optimization.js"></script>
  <style>
    @font-face {
      font-family: 'sitefont';
      src: url('beyoncefont.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      font-family: 'sitefont', monospace;
      background-color: black;
      color: white;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
    }
    .topbar {
      display: none;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 15px;
      background-color: black;
      border-bottom: 1px solid #333;
      width: 100%;
      height: 50px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1001;
      box-sizing: border-box;
    }
    .hamburger { font-size: 24px; cursor: pointer; margin-right: 10px; }
    .top-name { font-size: 18px; text-transform: uppercase; flex: 1; text-align: center; letter-spacing: 1px; }
    .sidebar {
      width: 260px;
      height: 100dvh;
      padding: 24px;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255,255,255,0.15);
      z-index: 3000;
    }
    .profile-img {
      width: 120px; height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 2px solid #fff;
    }
    .name {
      font-size: 24px;
      margin-bottom: 40px;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .button {
      padding: 10px;
      text-align: center;
      text-decoration: none;
      color: white;
      font-size: 13px;
      letter-spacing: 2px;
      border: 1px solid rgba(255,255,255,0.4);
      transition: 0.3s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      border-radius: inherit;
      z-index: -1;
      transition: background 0.2s ease;
    }

    .button:hover::before {
      background: rgba(0, 0, 0, 0.3);
    }

    .button:hover { border-color: white; }
    .footer {
      margin-top: auto;
      font-size: 10px;
      opacity: 0.7;
      text-align: center;
    }
    .footer a {
      color: white;
      text-decoration: none;
    }
    .footer a:hover { opacity: 0.5; }
    .footer-dot { color: white; font-size: 10px; opacity: 0.7; }
    .copyright { font-size: 8px; margin-top: 5px; width: 100%; }

    .main {
      margin-left: 260px;
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      min-height: 100vh;
      height: auto;
      max-height: none;
      margin-top: 10px;
    }
    .main::-webkit-scrollbar { display: none; }
    .main { -ms-overflow-style: none; scrollbar-width: none; }
    .main h1 { font-size: 28px; margin: 0 0 10px 0; letter-spacing: 1px; }

    .upload-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 800px;
      box-sizing: border-box;
    }
    .upload-section {
      margin-bottom: 0px;
    }
    .upload-section h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
      grid-auto-flow: row;
    }
    .track-title-row,
    .track-feature-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .track-title-row #trackTitle,
    .track-feature-row #trackFeature {
      flex: 1;
      min-width: 0;
      height: 48px;
    }
    .track-feature-row .custom-checkbox-wrapper {
      flex-shrink: 0;
    }
    #releaseDate {
      width: 260px;
      max-width: 100%;
      text-align: center;
    }
    .cover-card {
      display: grid;
      gap: 12px;
      max-width: 360px;
      margin: 0 auto 4px;
    }
    .cover-card.single-cover {
      grid-column: 1 / -1;
      width: 100%;
    }
    .cover-card[hidden] { display: none; }
    .field-note {
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.6;
    }
    .image-preview {
      aspect-ratio: 1 / 1;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.02);
    }
    .image-preview.empty::before {
      content: 'No image';
      color: #777;
      font-size: 11px;
      letter-spacing: 1px;
    }
    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .image-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .image-input { display: none; }
    .image-btn {
      flex: 1;
      min-height: 40px;
      padding: 8px 6px;
      border: 1px solid #444;
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      color: white;
      font-family: inherit;
      cursor: pointer;
    }
    .image-btn.delete { border-color: rgba(255, 92, 92, 0.38); }
    .image-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .status-line {
      font-size: 12px;
      opacity: 0.8;
      min-height: 1em;
    }
    #releaseTitleInput {
      grid-column: 1/-1;
    }
    .file-upload-area {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .file-upload-area label {
      flex: 1;
      min-width: 150px;
    }
    .options-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .inline-controls-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .option-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .option-group input[type="checkbox"] {
      cursor: pointer;
    }
    .option-group label {
      cursor: pointer;
      user-select: none;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-buttons button {
      flex: 1;
      min-width: 140px;
    }
    input, select, textarea {
      background: transparent;
      border: 1px solid #444;
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-family: 'sitefont', monospace;
      font-size: 14px;
      box-sizing: border-box;
      text-transform: uppercase;
    }

    #trackNumber {
      width: 48px;
      min-width: 48px;
      max-width: 48px;
      height: 48px;
      min-height: 48px;
      max-height: 48px;
      text-align: center;
      padding: 0;
      flex-shrink: 0;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      border-radius: 6px;
      display: inline-block;
      vertical-align: middle;
    }
    textarea {
      min-height: 100px;
      resize: none;
      width: 100%;
      grid-column: 1 / -1;
      box-sizing: border-box;
      font-family: inherit;
      font-size: inherit;
    }
    input::placeholder { color: #777; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .checkbox-row input[type="checkbox"] { accent-color: #00ff99; }

    .primary-btn {
      background: #00ff99;
      border: none;
      color: #000;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      margin: 12px 0;
      font-family: 'sitefont', monospace;
      text-transform: uppercase;
    }
    .primary-btn:hover { background: #00cc77; }
    .secondary-btn {
      background: #222;
      border: 1px solid #666;
      color: white;
      margin-left: 10px;
    }
    .secondary-btn:hover { border-color: #999; }

    #albumDatabase { margin-top: 14px; width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .section-title {
      grid-column: 1 / -1;
      font-size: 18px;
      letter-spacing: 4px;
      opacity: 0.85;
      margin: 10px 0;
    }
    .section-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-header button {
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      padding: 6px 10px;
      cursor: pointer;
      color: white;
      background: #333;
      border: 1px solid #555;
      border-radius: 4px;
    }
    .section-header button:hover { background: #444; }
    .entry {
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 14px;
      text-align: center;
    }
    .entry h2 { font-size: 16px; margin: 0 0 8px 0; }
    .entry p { font-size: 12px; opacity: 0.8; margin: 3px 0; }
    .edit-btn {
      background: #333; border: 1px solid #555; color: white; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 10px;
    }
    .edit-btn:hover { background: #444; }

    /* ================= CUSTOM CHECKBOX ================= */
    .custom-checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .custom-checkbox-wrapper input[type="checkbox"] {
      display: none;
    }
    .custom-checkbox-wrapper label {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .custom-checkbox-wrapper label::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 24px;
      margin-right: 8px;
      border: 2px solid #666;
      border-radius: 4px;
      background: transparent;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .custom-checkbox-wrapper input[type="checkbox"]:checked + label::before {
      background: #ff3333;
      border-color: #ff3333;
      box-shadow: 0 0 8px rgba(255, 51, 51, 0.5);
    }
    .custom-checkbox-wrapper input[type="checkbox"]:checked + label::after {
      content: "✓";
      position: absolute;
      margin-left: 7px;
      margin-top: -1px;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }
    .custom-checkbox-wrapper input[type="checkbox"]:hover:not(:checked) + label::before {
      border-color: #999;
    }

    /* ================= DELETE BUTTON ================= */
    .delete-btn {
      background: #ff3333;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      margin: 12px 0;
      font-family: 'sitefont', monospace;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .delete-btn:hover {
      background: #cc0000;
      box-shadow: 0 0 12px rgba(255, 51, 51, 0.6);
    }
    .delete-btn:active {
      transform: scale(0.98);
    }

    @media (max-width: 768px) {
      body { 
        flex-direction: column;
        padding-top: 50px;
      }
      .topbar { 
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 50px;
        padding: 0 15px;
        padding-top: max(0px, env(safe-area-inset-top));
        align-items: center;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.15);
        z-index: 2101;
      }
      .hamburger { 
        font-size: 28px;
        cursor: pointer;
        padding: 5px;
      }
      .top-name {
        margin: 0 auto;
        font-size: 16px;
        letter-spacing: 2px;
      }
      .sidebar {
        display: none;
        position: fixed;
        top: 50px;
        left: 0;
        width: 100%;
        height: calc(100dvh - 50px);
        max-height: none;
        padding: 15px;
        z-index: 1900;
        background: black;
        border-right: none;
        border-bottom: 1px solid #333;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .sidebar.active { display: flex; }
      .main {
        margin-left: 0;
        margin-top: 50px;
        padding: 15px;
        width: 100%;
        height: auto;
        min-height: calc(100dvh - 50px);
        padding-bottom: max(40px, calc(15px + env(safe-area-inset-bottom)));
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .form-grid { grid-template-columns: 1fr; }
      #albumDatabase { grid-template-columns: 1fr; }
    }

  </style>

</head>

  <div class="main">
    <h1>Edit Album Info</h1>
    <div class="upload-box">
      <div class="upload-section">
        <h4>Album Details</h4>
        <div class="form-grid">
          <input id="albumTitle" type="text" placeholder="Album Title" />
          <input id="albumArtist" type="text" placeholder="Album Artist" />

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic-to@1.6.5/dist/iife/heic-to.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDf2Caujz2FQuUDtzDr8eArpmaHXX_vsVY",
      authDomain: "music-database-3ee0a.firebaseapp.com",
      databaseURL: "https://music-database-3ee0a-default-rtdb.firebaseio.com",
      projectId: "music-database-3ee0a",
      storageBucket: "music-database-3ee0a.firebasestorage.app",
      messagingSenderId: "148257189959",
      appId: "1:148257189959:web:3e52404367191d5835c162"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const albumRef = db.ref('album');
    const tracksRef = db.ref('tracks');

    let tracks = [];
    let keys = [];
    let editingTrack = null;
    let showAll = false;

    function render() {
      const container = document.getElementById('albumDatabase');
      container.innerHTML = '';
      
      const tracksToShow = showAll ? tracks : tracks.slice(-3).reverse();

      if (tracks.length) {
        container.innerHTML += `
          <div class="section-header">
            <div class="section-title">TRACKS</div>
            <button onclick="toggleShowAll()">${showAll ? 'Hide All' : 'Show All'}</button>
          </div>
        `;
        
        tracksToShow.forEach((e, i) => {
          const actualIndex = tracks.indexOf(e);
          const explicitSymbol = e.explicit ? ' 🄴' : '';
          const scheduleLabel = e.scheduleEnabled && e.scheduleDate ? ` | SCHEDULED: ${e.scheduleDate}` : '';
          container.innerHTML += `
            <div class="entry">
              <h2>${e.number}. ${e.title}${explicitSymbol} — ${e.artist}</h2>
              <p>Release: ${e.releaseDate || 'N/A'}${scheduleLabel}</p>
              <button onclick="editTrack(${actualIndex})" class="edit-btn">Edit</button>
            </div>`;
        });
      }
    }

    function toggleShowAll() {
      showAll = !showAll;
      render();
    }

    function updateAlbum() {
      const title = document.getElementById('albumTitle').value.trim();
      const artist = document.getElementById('albumArtist').value.trim() || 'Jae Laurent';
      if (!title) return alert('Title required');
      // Gather all track credits for album credits
      tracksRef.once('value', snap => {
        const val = snap.val() || {};
        let allCredits = Object.values(val).map(t => t.credits).filter(Boolean).join('<br>');
        const data = { title, credits: allCredits, artist, cover: albumCover.get() };
        albumRef.set(data).then(() => {
          albumCover.status.textContent = 'Album published.';
        }).catch(error => {
          albumCover.status.textContent = `Publishing failed: ${error.message}`;
        });
      });
    }

    function saveTrack() {
      const number = parseInt(document.getElementById('trackNumber').value);
      const title = document.getElementById('trackTitle').value.trim();
      const feature = document.getElementById('trackFeature').value.trim();
      const explicit = document.getElementById('explicitToggle').checked;
      const releaseDate = document.getElementById('releaseDate').value;
      const scheduleEnabled = document.getElementById('scheduleToggle').checked;
      if (scheduleEnabled && !releaseDate) return alert('Set a release date to schedule this track');
      // The site hides scheduled tracks until scheduleDate, which is the release date.
      const scheduleDate = scheduleEnabled ? releaseDate : '';
      const albumArtist = document.getElementById('albumArtist').value.trim() || 'Jae Laurent';
      let artist = albumArtist;
      if (feature) {
        if (feature.includes('&')) {
          // Multiple features, show as "albumArtist, feature1 & feature2"
          artist = albumArtist + ', ' + feature;
        } else {
          // Single feature, show as "albumArtist & feature"
          artist = albumArtist + ' & ' + feature;
        }
      }
      const creditProduced = document.getElementById('creditProduced').value.trim() || 'Jae Laurent';
      const creditSampled = document.getElementById('creditSampled').value.trim();

      if (!title || isNaN(number)) return alert('Title and Number required');

      // Generate slug from title
      function slugify(str) {
        return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      }
      const slug = slugify(title);

      // Build credits string for preview/legacy
      let creditsArr = [];
      if (creditProduced) creditsArr.push(`${creditProduced}`);
      if (creditSampled) creditsArr.push(`SAMPLED FROM ${creditSampled}`);

      // Deduplicate exact producer entries, keeping the first original value.
      const seenCredits = new Set();
      creditsArr = creditsArr.filter(entry => {
        const normalized = entry.trim().toLowerCase();
        if (seenCredits.has(normalized)) return false;
        seenCredits.add(normalized);
        return true;
      });

      const credits = `<p>${creditsArr.join(' / ')}</p>`;

      const single = singleToggle.checked;
      const cover = single ? singleCover.get() : null;

      const data = { number, title, artist, feature, explicit, releaseDate, scheduleEnabled, scheduleDate, credits,
        creditProduced, creditSampled, single, cover };

      tracksRef.child(slug).set(data).then(resetTrackForm);
    }

    function deleteTrack() {
      if (editingTrack !== null && confirm('Delete this track?')) {
        tracksRef.child(keys[editingTrack]).remove().then(resetTrackForm);
      }
    }

    window.editTrack = i => {
      const e = tracks[i];
      document.getElementById('trackNumber').value = e.number;
      document.getElementById('trackTitle').value = e.title;
      document.getElementById('trackFeature').value = e.feature || '';
      document.getElementById('explicitToggle').checked = e.explicit || false;
      document.getElementById('releaseDate').value = e.releaseDate || e.scheduleDate || '';
      document.getElementById('scheduleToggle').checked = e.scheduleEnabled || false;
      singleToggle.checked = e.single || false;
      singleCover.set(e.cover);
      syncSingleCoverVisibility();
      document.getElementById('creditProduced').value = e.creditProduced || 'Jae Laurent';
      document.getElementById('creditSampled').value = e.creditSampled || '';
      editingTrack = i;
      document.getElementById('addUpdateTrackBtn').textContent = 'Update Track';
      document.getElementById('deleteTrackBtn').style.display = 'inline-block';
    };
    // Populate track number dropdown
    function populateTrackNumberDropdown() {
      const select = document.getElementById('trackNumber');
      if (!select) return;
      for (let i = 1; i <= 50; i++) {
        select.innerHTML += `<option value="${i}">${i}</option>`;
      }
    }
    populateTrackNumberDropdown();

    function resetTrackForm() {
      document.getElementById('trackNumber').value = '';
      document.getElementById('trackTitle').value = '';
      document.getElementById('trackFeature').value = '';
      document.getElementById('explicitToggle').checked = false;
      document.getElementById('releaseDate').value = '';
      document.getElementById('scheduleToggle').checked = false;
      singleToggle.checked = false;
      singleCover.set(null);
      syncSingleCoverVisibility();
      document.getElementById('creditProduced').value = '';
      document.getElementById('creditSampled').value = '';
      editingTrack = null;
      document.getElementById('addUpdateTrackBtn').textContent = 'Add Track';
      document.getElementById('deleteTrackBtn').style.display = 'none';
    }

    // ===== COVER UPLOADERS =====
    // Wires a .cover-card's upload/replace/delete buttons; get()/set() hold the image as a data URL.
    function createCoverUploader(card, publishLabel) {
      const preview = card.querySelector('.image-preview');
      const input = card.querySelector('.image-input');
      const buttons = card.querySelectorAll('.image-btn');
      const status = card.querySelector('.status-line');
      let image = null;

      function refresh() {
        const hasImage = Boolean(image);
        preview.classList.toggle('empty', !hasImage);
        preview.innerHTML = hasImage ? `<img src="${image}" alt="Cover" />` : '';
        buttons.forEach(button => {
          const isUpload = button.dataset.action === 'upload';
          button.disabled = isUpload ? hasImage : !hasImage;
        });
        input.value = '';
      }

      buttons.forEach(button => {
        button.addEventListener('click', () => {
          if (button.dataset.action === 'delete') {
            image = null;
            refresh();
            status.textContent = `Cover removed. Click ${publishLabel} to publish.`;
            return;
          }
          input.click();
        });
      });

      input.addEventListener('change', async event => {
        const file = event.target.files[0];
        if (!file) return;
        status.textContent = 'Processing image...';
        try {
          image = await readCoverAsDataURL(file);
          refresh();
          status.textContent = `Cover ready. Click ${publishLabel} to publish.`;
        } catch (error) {
          status.textContent = `Could not read image: ${error.message}`;
        }
      });

      refresh();
      return {
        get: () => image,
        set: value => { image = value || null; status.textContent = ''; refresh(); },
        status
      };
    }

    // Downscale to keep the cover small enough for the realtime database.
    async function readCoverAsDataURL(file) {
      const isHeic = /\.(heic|heif)$/i.test(file.name) || /^image\/(heic|heif)/i.test(file.type);
      let blob = file;
      if (isHeic) {
        if (typeof window.HeicTo !== 'function') {
          throw new Error('The HEIC converter did not load. Check your connection and try again.');
        }
        blob = await window.HeicTo({ blob: file, type: 'image/jpeg', quality: 0.9 });
      }
      const bitmap = await createImageBitmap(blob);
      const scale = Math.min(1, 1200 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.85);
    }

    const albumCover = createCoverUploader(document.getElementById('albumCoverCard'), 'Update Album');
    const singleCover = createCoverUploader(document.getElementById('singleCoverCard'), 'Add/Update Track');

    const singleToggle = document.getElementById('singleToggle');
    function syncSingleCoverVisibility() {
      document.getElementById('singleCoverCard').hidden = !singleToggle.checked;
    }
    singleToggle.addEventListener('change', syncSingleCoverVisibility);
    syncSingleCoverVisibility();

    // Load album data into form for editing
    albumRef.once('value', snap => {
      const data = snap.val() || {};
      document.getElementById('albumTitle').value = data.title || '';
      document.getElementById('albumArtist').value = data.artist || '';
      albumCover.set(data.cover);
    });

    tracksRef.on('value', snap => {
      const val = snap.val() || {};
      // Sort both keys and tracks by track number
      const entries = Object.entries(val).map(([k, v]) => [k, v]);
      entries.sort((a, b) => (a[1].number || 0) - (b[1].number || 0));
      keys = entries.map(([k]) => k);
      tracks = entries.map(([, v]) => v);
      render();
    });

    document.getElementById('updateAlbumBtn').onclick = updateAlbum;
    document.getElementById('addUpdateTrackBtn').onclick = saveTrack;
    document.getElementById('deleteTrackBtn').onclick = deleteTrack;

    document.querySelector('.hamburger').onclick = () => {
      document.querySelector('.sidebar').classList.toggle('active');
    };
  </script>
</body>
</html>
