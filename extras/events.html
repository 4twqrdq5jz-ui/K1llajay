<!DOCTYPE html>

<head>

  <style>
@font-face {
  font-family: 'sitefont';
  src: url('/font/kobuzan-cy-grotesk-grand-dark.otf') format('opentype');
  font-display: swap;
}
@font-face {
  font-family: 'altfont';
  src: url('/font/TT-Commons-Pro-Bold-GFXTRA.COM-iF66f11118bc78d.ttf') format('truetype');
  font-weight: 800;
  font-display: swap;
}

:root {
  --topbar-h: calc(76px + env(safe-area-inset-top, 0px));
  --cal-w: 300px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  min-height: 100dvh;
  font-family: 'sitefont', monospace;
  color: white;
  background: #000;
}

body {
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ================= TOP BAR ================= */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  padding: env(safe-area-inset-top, 0px) 24px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000 url("/images/IMG_4619.png") center / cover no-repeat;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  z-index: 20;
}
.top-bar .menu-btn { position: absolute; left: calc(24px + env(safe-area-inset-left, 0px)); bottom: 20px; }
.top-bar-title {
  font-family: 'altfont', sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #ffe600;
  white-space: nowrap;
}
.menu-btn {
  width: 44px; height: 36px; padding: 8px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 230, 0, 0.5);
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.menu-btn span { display: block; width: 100%; height: 4px; background: #ffe600; border-radius: 999px; }
body.menu-open .menu-btn { visibility: hidden; }

/* ================= SITE MENU ================= */
.sidebar {
  position: fixed; left: 0; top: 0;
  width: 280px; max-width: 85vw; height: 100%;
  background: #071123;
  color: #ffe600;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 24px 24px;
  box-shadow: 2px 0 18px rgba(0, 0, 0, 0.6);
  transition: transform .28s ease, opacity .28s ease, visibility .28s ease;
  z-index: 30;
  overflow: auto;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.sidebar.open { transform: translateX(0); opacity: 1; visibility: visible; pointer-events: auto; }
.sidebar .close {
  position: absolute; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px));
  background: transparent; border: 0; color: #ffe600; font-size: 24px; cursor: pointer;
}
.sidebar nav { margin-top: 36px; display: flex; flex-direction: column; gap: 12px; }
.sidebar a { color: #ffe600; text-decoration: none; padding: 6px 8px; border-radius: 6px; }
.sidebar a:hover { background: rgba(255, 230, 0, 0.1); }

/* ================= MAIN ================= */
/* Width is the screen minus the calendar column, so nothing hides under the calendar */
.main-content {
  flex: 1;
  width: calc(100% - var(--cal-w));
  padding: calc(var(--topbar-h) + 28px) 32px 40px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.main-inner {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 28px;
  flex: 1;
}

.page-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.page-title {
  font-family: 'altfont', sans-serif;
  font-size: 22px;
  letter-spacing: 4px;
  color: #ffe600;
  text-shadow: 0 0 12px rgba(255, 230, 0, 0.25);
}

.calendar-toggle {
  display: none;
  font-family: 'sitefont', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 8px 14px;
  cursor: pointer;
  color: #ffe600;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(255, 230, 0, 0.45);
  border-radius: 8px;
}

.events-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1;
}
.event-card {
  width: 100%;
  border-radius: 14px;
  padding: 20px 18px;
  background: #0a1a3a;
  border: 8px solid #0a1a3a;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease;
}
.event-card:nth-child(odd) { background: #071123; border-color: #071123; }
@media (hover: hover) {
  .event-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 230, 0, 0.25);
  }
}
.event-card.type-collaboration { border-left: 6px solid #C7B3E5; }
.event-card.type-release { border-left: 6px solid #F38181; }
.event-card.type-other { border-left: 6px solid #90E0EF; }

.event-date { font-size: 12px; letter-spacing: 1.5px; margin-bottom: 6px; color: rgba(255, 230, 0, 0.7); }
.event-title { font-size: 18px; letter-spacing: 1px; color: #ffe600; margin-bottom: 8px; line-height: 1.3; overflow-wrap: break-word; }
.event-description { font-size: 13px; line-height: 1.55; opacity: 0.9; overflow-wrap: break-word; }

.no-events {
  flex: 1;
  min-height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  opacity: 0.65;
  padding: 24px;
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: 1px;
  color: #ffe600;
}

/* ================= CALENDAR COLUMN ================= */
.floating-sidebar {
  position: fixed;
  right: 0;
  top: var(--topbar-h);
  width: var(--cal-w);
  height: calc(100dvh - var(--topbar-h));
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  background: #071123;
  border-left: 1px solid rgba(255, 230, 0, 0.15);
  display: flex;
  flex-direction: column;
  gap: 24px;
  overflow-y: auto;
  scrollbar-width: none;
  z-index: 15;
}
.floating-sidebar::-webkit-scrollbar { display: none; }

.calendar-close {
  display: none;
  align-self: flex-end;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 230, 0, 0.4);
  color: #ffe600;
  padding: 6px 12px;
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
  border-radius: 6px;
  font-family: 'sitefont', monospace;
}

.calendar-section, .previous-event-section { display: flex; flex-direction: column; gap: 12px; }
.calendar-title, .previous-event-title { font-size: 13px; letter-spacing: 2px; color: #ffe600; opacity: 0.85; }
.calendar {
  width: 100%;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 230, 0, 0.2);
  border-radius: 10px;
  padding: 12px;
}
.calendar-month {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  letter-spacing: 1px;
  margin-bottom: 10px;
  color: #ffe600;
  text-align: center;
}
.calendar-month span { flex: 1; min-width: 0; }
.calendar-nav-button {
  flex-shrink: 0;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 230, 0, 0.35);
  color: #ffe600;
  font-size: 12px;
  padding: 4px 8px;
  cursor: pointer;
  border-radius: 5px;
}
.calendar-nav-button:disabled { opacity: 0.3; cursor: not-allowed; }

.calendar-weekdays, .calendar-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.calendar-weekdays { margin-bottom: 6px; }
.calendar-day-header { text-align: center; font-size: 9px; opacity: 0.55; color: #ffe600; }
.calendar-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: white;
}
.calendar-day.empty { visibility: hidden; }
.calendar-day.clickable { cursor: pointer; }
.calendar-day.clickable:hover { background: rgba(255, 230, 0, 0.1); border-color: rgba(255, 230, 0, 0.35); }
.calendar-day.past-day { opacity: 0.35; pointer-events: none; }
.calendar-day.today { background: rgba(255, 230, 0, 0.18); border-color: #ffe600; color: #ffe600; font-weight: bold; }
@keyframes april21glow {
  0%, 100% { box-shadow: 0 0 6px rgba(255, 230, 0, 0.5); border-color: rgba(255, 230, 0, 0.7); }
  50% { box-shadow: 0 0 16px rgba(255, 230, 0, 0.9); border-color: #ffe600; }
}
.calendar-day.april21 { animation: april21glow 1.5s infinite; background: rgba(255, 230, 0, 0.12); }
.calendar-day.april21.past-day { opacity: 0.45; animation: none; }
@media (prefers-reduced-motion: reduce) { .calendar-day.april21 { animation: none; } }

.previous-event-card {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 230, 0, 0.2);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
}
.previous-event-card.type-collaboration { border-left: 3px solid #C7B3E5; }
.previous-event-card.type-release { border-left: 3px solid #F38181; }
.previous-event-card.type-other { border-left: 3px solid #90E0EF; }
.previous-event-date { font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; color: rgba(255, 230, 0, 0.7); }
.previous-event-name { font-size: 14px; color: #ffe600; overflow-wrap: break-word; }
.list-empty { opacity: 0.6; font-size: 12px; line-height: 1.5; color: #ffe600; }

/* ================= FOOTER ================= */
.footer {
  width: calc(100% - var(--cal-w));
  padding: 20px 32px calc(30px + env(safe-area-inset-bottom, 0px));
  color: #fff;
  font-size: 13px;
  line-height: 1.6;
  letter-spacing: 0.5px;
}
.footer a { color: #ffe600; text-decoration: none; }

/* ================= PHONE + iPAD PORTRAIT ================= */
@media (max-width: 900px) {
  .main-content { width: 100%; padding: calc(var(--topbar-h) + 20px) 14px 30px; }
  .footer { width: 100%; padding: 20px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .page-title { font-size: 18px; letter-spacing: 3px; }
  .top-bar { padding-left: 16px; padding-right: 16px; }
  .top-bar .menu-btn { left: calc(16px + env(safe-area-inset-left, 0px)); }
  .top-bar-title { font-size: 18px; }
  .event-card { border-width: 6px; padding: 16px 14px; }
  .event-title { font-size: 16px; }
  .no-events { font-size: 13px; }

  .calendar-toggle, .calendar-close { display: inline-block; }

  /* Calendar becomes a full-width panel under the top bar */
  .floating-sidebar {
    width: 100%;
    z-index: 25;
    transform: translateY(8px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease, visibility .2s ease;
  }
  body.calendar-open .floating-sidebar {
    transform: none;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  .calendar-section, .previous-event-section { width: 100%; max-width: 420px; margin: 0 auto; }
  body.calendar-open { overflow: hidden; }
}

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script>
const firebaseConfig = {
  apiKey: "AIzaSyDQwlDjIGA2whvBDhOeLrnseQB4EoP7EcA",
  authDomain: "mainsite-eb919.firebaseapp.com",
  databaseURL: "https://mainsite-eb919-default-rtdb.firebaseio.com",
  projectId: "mainsite-eb919",
  storageBucket: "mainsite-eb919.firebasestorage.app",
  messagingSenderId: "799554641103",
  appId: "1:799554641103:web:f23b774cbb08e03aebebba"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const eventsContainer = document.getElementById('events-container');
const listContainer = document.getElementById('previous-events-container');
const listTitle = document.getElementById('listTitle');

const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MIN_YEAR = 2023, MIN_MONTH = 11, MAX_YEAR = 2030, MAX_MONTH = 11;

const getTodayStart = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
let displayMonth = getTodayStart().getMonth();
let displayYear = getTodayStart().getFullYear();

let rawEvents = [];   // every event from Firebase
let allEvents = {};   // grouped by YYYY-MM-DD
let loaded = false;

function normalizeDate(rawDate) {
  if (!rawDate) return '';
  const value = String(rawDate).trim();
  if (value.includes('-')) return value;
  if (value.includes('/')) {
    const parts = value.split('/').map(p => p.trim());
    if (parts.length === 3) {
      const [y, m, d] = parts;
      return `${y.length === 4 ? y : `20${y}`}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
  }
  return value;
}
const toDate = (s) => { const [y, m, d] = normalizeDate(s).split('-').map(Number); return (y && m && d) ? new Date(y, m - 1, d) : null; };
const dateKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function getEventTypeClass(event) {
  const t = String(event.type || '').toLowerCase();
  return t === 'collaboration' ? 'type-collaboration' : t === 'release' ? 'type-release' : 'type-other';
}
function getEventTypeColor(event) {
  const t = String(event.type || '').toLowerCase();
  return t === 'collaboration' ? '#C7B3E5' : t === 'release' ? '#F38181' : '#90E0EF';
}
function groupEventsByTitle(events) {
  const map = new Map();
  events.forEach(e => { const k = String(e.title || 'Event').toLowerCase(); if (!map.has(k)) map.set(k, e); });
  return Array.from(map.values());
}
function birthdayEvent(year) {
  return { date: `${year}-04-21`, title: `Jae Laurent's ${year - 2004} Birthday` };
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

/* ---------- Side list ---------- */
function renderList(label, events, emptyText) {
  listTitle.textContent = label;
  listContainer.replaceChildren();
  const merged = groupEventsByTitle(events);
  if (!merged.length) { listContainer.appendChild(el('div', 'list-empty', emptyText)); return; }
  merged.forEach(event => {
    const card = el('div', `previous-event-card ${getEventTypeClass(event)}`);
    card.append(el('div', 'previous-event-date', event.date || 'TBA'), el('div', 'previous-event-name', event.title || 'Event'));
    listContainer.appendChild(card);
  });
}

function eventsInMonth(year, monthIndex) {
  return rawEvents.filter(e => { const d = toDate(e.date); return d && d.getFullYear() === year && d.getMonth() === monthIndex; });
}

function renderSidebarForDisplayedMonth() {
  const today = getTodayStart();
  const isPast = displayYear < today.getFullYear() || (displayYear === today.getFullYear() && displayMonth < today.getMonth());
  const isFuture = displayYear > today.getFullYear() || (displayYear === today.getFullYear() && displayMonth > today.getMonth());

  if (isPast) return renderList('Past Events', eventsInMonth(displayYear, displayMonth), 'No past events this month');
  if (isFuture) {
    const list = eventsInMonth(displayYear, displayMonth);
    if (displayMonth === 3) list.unshift(birthdayEvent(displayYear));
    return renderList('Future Events', list, 'No future events this month');
  }
  const pastThisMonth = eventsInMonth(displayYear, displayMonth).filter(e => toDate(e.date) < today);
  renderList('Past Events', pastThisMonth, 'No past events this month');
}

function displayEventsForDate(selected) {
  const today = getTodayStart();
  if (selected.getTime() === today.getTime()) return renderSidebarForDisplayedMonth();
  const key = dateKey(selected);
  const list = [...(allEvents[key] || [])];
  if (selected.getMonth() === 3 && selected.getDate() === 21) list.unshift(birthdayEvent(selected.getFullYear()));
  renderList(`${monthNames[selected.getMonth()]} ${selected.getDate()}`, list, 'No events on this day');
}

/* ---------- Calendar ---------- */
function generateCalendar() {
  const today = getTodayStart();
  document.getElementById('calendar-month-text').textContent = `${monthNames[displayMonth]} ${displayYear}`;
  const firstDay = new Date(displayYear, displayMonth, 1).getDay();
  const daysInMonth = new Date(displayYear, displayMonth + 1, 0).getDate();
  const grid = document.getElementById('calendar-days');
  grid.replaceChildren();

  for (let i = 0; i < firstDay; i++) grid.appendChild(el('div', 'calendar-day empty'));

  for (let day = 1; day <= daysInMonth; day++) {
    const dayDate = new Date(displayYear, displayMonth, day);
    const dayEl = el('div', 'calendar-day', day);
    const dayEvents = allEvents[dateKey(dayDate)];
    const hasEvents = dayEvents && dayEvents.length > 0;
    const isBirthday = displayMonth === 3 && day === 21;
    const isToday = dayDate.getTime() === today.getTime();
    const isPast = dayDate < today;

    if (hasEvents) {
      dayEl.style.borderLeftColor = getEventTypeColor(dayEvents[0]);
      dayEl.style.borderLeftWidth = '3px';
    }
    if (isBirthday) dayEl.classList.add('april21');
    else if (isToday) dayEl.classList.add('today');
    if (isPast) dayEl.classList.add('past-day');

    if (!isPast && (hasEvents || isBirthday || isToday)) {
      dayEl.classList.add('clickable');
      dayEl.addEventListener('click', () => displayEventsForDate(dayDate));
    }
    grid.appendChild(dayEl);
  }

  document.getElementById('prev-month').disabled = (displayYear === MIN_YEAR && displayMonth === MIN_MONTH);
  document.getElementById('next-month').disabled = (displayYear === MAX_YEAR && displayMonth === MAX_MONTH);
}

document.getElementById('prev-month').addEventListener('click', () => {
  if (displayMonth === 0) { displayMonth = 11; displayYear--; } else displayMonth--;
  generateCalendar();
  if (loaded) renderSidebarForDisplayedMonth();
});
document.getElementById('next-month').addEventListener('click', () => {
  if (displayMonth === 11) { displayMonth = 0; displayYear++; } else displayMonth++;
  generateCalendar();
  if (loaded) renderSidebarForDisplayedMonth();
});

/* ---------- Upcoming events (main column) ---------- */
function renderUpcoming() {
  const today = getTodayStart();
  const nextMonthStart = new Date(today.getFullYear(), today.getMonth() + 1, 1);
  const upcoming = groupEventsByTitle(
    rawEvents
      .filter(e => { const d = toDate(e.date); return d && d >= today && d < nextMonthStart; })
      .sort((a, b) => toDate(a.date) - toDate(b.date))
  );

  eventsContainer.replaceChildren();
  if (!upcoming.length) {
    eventsContainer.appendChild(el('div', 'no-events', 'No upcoming events at this time. Check back soon!'));
    return;
  }
  upcoming.forEach(event => {
    const card = el('div', `event-card ${getEventTypeClass(event)}`);
    card.append(el('div', 'event-date', event.date || 'TBA'), el('div', 'event-title', event.title || 'Event'));
    if (String(event.type).toLowerCase() !== 'release' && event.description) {
      card.appendChild(el('div', 'event-description', event.description));
    }
    eventsContainer.appendChild(card);
  });
}

/* ---------- One live Firebase listener feeds everything ---------- */
generateCalendar(); // draws the empty grid right away; event markers appear once data loads

db.ref('events').on('value', snap => {
  const data = snap.val() || {};
  rawEvents = Object.values(data).filter(e => e && e.date);
  allEvents = {};
  rawEvents.forEach(e => {
    const k = normalizeDate(e.date);
    (allEvents[k] = allEvents[k] || []).push(e);
  });
  loaded = true;
  generateCalendar();
  renderSidebarForDisplayedMonth();
  renderUpcoming();
}, err => {
  console.error('Could not load events:', err);
  eventsContainer.replaceChildren(el('div', 'no-events', 'Events could not be loaded. Refresh the page to try again.'));
});

/* ---------- Site menu ---------- */
(function () {
  const sidebar = document.getElementById('siteSidebar');
  const closeBtn = sidebar.querySelector('.close');
  const menuBtn = document.querySelector('.menu-btn');
  const open = () => { sidebar.classList.add('open'); document.body.classList.add('menu-open'); sidebar.setAttribute('aria-hidden', 'false'); };
  const close = () => { sidebar.classList.remove('open'); document.body.classList.remove('menu-open'); sidebar.setAttribute('aria-hidden', 'true'); };
  menuBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  document.addEventListener('click', e => {
    if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) close();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { close(); setCalendar(false); } });
})();

/* ---------- Mobile calendar panel ---------- */
const calendarToggle = document.getElementById('calendarToggle');
function setCalendar(openState) {
  document.body.classList.toggle('calendar-open', openState);
  calendarToggle.setAttribute('aria-expanded', String(openState));
}
calendarToggle.addEventListener('click', () => setCalendar(!document.body.classList.contains('calendar-open')));
document.getElementById('calendarClose').addEventListener('click', () => setCalendar(false));
  </script>
</body>
