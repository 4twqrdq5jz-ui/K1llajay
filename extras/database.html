<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Catalog Database – Jae Laurent</title>
  <link rel="icon" href="images/favicon.ico">
  <script src="device-optimization.js"></script>
  <script src="anti-lag-optimization.js"></script>
  <style>
@font-face {
  font-family: 'sitefont';
  src: url('/font/kobuzan-cy-grotesk-grand-dark.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'altfont';
  src: url('/font/TT-Commons-Pro-Bold-GFXTRA.COM-iF66f11118bc78d.ttf') format('truetype');
  font-weight: 800;
  font-style: normal;
  font-display: swap;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100dvh;
  font-family: 'sitefont', monospace;
  color: white;
  background: #000000;
}
html { height: 100vh; height: 100dvh; }

/* ================= TOP BAR ================= */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 76px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: url("/images/IMG_4619.png") center / cover no-repeat;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 20;
  font-family: 'altfont', sans-serif;
}
.top-bar .menu-btn { position: absolute; left: 24px; }
.top-bar-title {
  font-family: 'altfont', sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #ffe600;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 0 18px rgba(255, 230, 0, 0.35);
}
.menu-btn {
  width: 44px; height: 36px; padding: 8px;
  display: flex !important;
  flex-direction: column;
  justify-content: space-between;
  z-index: 999;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 230, 0, 0.5);
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.menu-btn span {
  display: block; width: 100%; height: 4px;
  background: #ffe600; border-radius: 999px;
}
body.menu-open .menu-btn { display: none !important; }

/* ================= SIDEBAR ================= */
.sidebar {
  position: fixed; left: 0; top: 0;
  width: 280px; height: 100%;
  background: #071123;
  color: #ffe600;
  padding: 24px;
  box-shadow: 2px 0 18px rgba(0, 0, 0, 0.6);
  transition: transform .28s ease, opacity .28s ease, visibility .28s ease;
  z-index: 30;
  overflow: auto;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  font-family: 'sitefont', monospace;
}
.sidebar.active, .sidebar.open {
  transform: translateX(0);
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.sidebar .close {
  position: absolute; right: 12px; top: 12px;
  background: transparent; border: 0;
  color: #ffe600; font-size: 24px; cursor: pointer;
}
.sidebar nav {
  margin-top: 36px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.sidebar a {
  color: #ffe600;
  text-decoration: none;
  padding: 6px 8px;
  border-radius: 6px;
  transition: background 0.2s ease;
}
.sidebar a:hover {
  background: rgba(255, 230, 0, 0.1);
  text-decoration: none;
}

/* ================= BODY ================= */
body {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  position: relative;
  overflow-x: hidden;
  background: #000;
}

/* ================= MAIN CONTENT ================= */
.main-content {
  flex: 1;
  padding: 100px 20px 50px;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
  font-family: 'sitefont', monospace;
}
.main-content::-webkit-scrollbar { display: none; }
.main-content { -ms-overflow-style: none; scrollbar-width: none; }

#musicDatabase {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.section-header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 8px 0 4px;
}
.section-title {
  font-family: 'altfont', sans-serif;
  font-size: 18px;
  letter-spacing: 4px;
  color: #ffe600;
  text-shadow: 0 0 12px rgba(255, 230, 0, 0.25);
}
.section-header button {
  font-family: 'sitefont', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 7px 14px;
  cursor: pointer;
  color: #ffe600;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(255, 230, 0, 0.45);
  border-radius: 8px;
  transition: all 0.25s ease;
}
.section-header button:hover {
  background: rgba(255, 230, 0, 0.12);
  border-color: #ffe600;
  box-shadow: 0 0 18px rgba(255, 230, 0, 0.15);
}

/* Entry cards */
.entry {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  background: #0a1a3a;
  border: 8px solid #0a1a3a;
  padding: 18px 16px;
  text-align: center;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.35s ease;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
  font-family: 'sitefont', monospace;
}
.entry:nth-child(odd) {
  background: #000000;
  border-color: #000000;
}
.entry:hover {
  transform: scale(1.03) translateY(-4px);
  box-shadow:
    0 16px 40px rgba(0, 0, 0, 0.8),
    0 0 0 1px rgba(255, 230, 0, 0.25),
    0 0 30px rgba(255, 230, 0, 0.12);
}

.entry h2 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #ffe600;
  line-height: 1.3;
  margin: 0 0 10px 0;
}
.entry p {
  font-size: 12px;
  opacity: 0.85;
  margin: 5px 0;
  letter-spacing: 0.3px;
}
.entry .unreleased-tag {
  color: #ffe600;
  font-size: 11px;
  letter-spacing: 1px;
}

/* ===== ISRC ROW + TOGGLE ===== */
.isrc-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 6px 0;
  font-size: 12px;
  opacity: 0.85;
  letter-spacing: 0.3px;
}
.isrc-label {
  color: white;
}
.track-toggle-btn {
  font-family: 'sitefont', monospace;
  font-size: 11px;
  padding: 2px 8px;
  cursor: pointer;
  color: #ffe600;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 230, 0, 0.4);
  border-radius: 5px;
  transition: all 0.2s ease;
  line-height: 1.2;
}
.track-toggle-btn:hover {
  background: rgba(255, 230, 0, 0.12);
  border-color: #ffe600;
}
.track-toggle-btn.open {
  background: rgba(255, 230, 0, 0.15);
  border-color: #ffe600;
}

/* Expanded list – stays inside the card */
.track-list {
  display: none;
  margin-top: 8px;
  text-align: left;
  padding: 8px 10px;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 8px;
  border: 1px solid rgba(255, 230, 0, 0.15);
}
.track-list.open {
  display: block;
}
.track-list-item {
  font-size: 11px;
  color: #ffe600;
  padding: 4px 0;
  letter-spacing: 0.3px;
  opacity: 0.95;
  line-height: 1.4;
}
.track-list-item .from-single {
  opacity: 0.55;
  font-size: 10px;
}

/* ================= FOOTER ================= */
.footer {
  max-width: 1200px;
  width: 100%;
  margin: 10px 0 40px 0;
  color: #ffffff;
  padding: 20px 24px;
  text-align: left;
  font-size: 13px;
  letter-spacing: 0.5px;
  font-family: 'sitefont', monospace;
}
.footer a {
  color: #ffe600;
  text-decoration: none;
}
.footer a:hover {
  text-decoration: underline;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 1100px) {
  #musicDatabase { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .main-content { padding: 92px 14px 30px; }
  #musicDatabase { grid-template-columns: 1fr; gap: 14px; }
  .top-bar-title { font-size: 18px; letter-spacing: 2px; }
  .entry { border-width: 6px; padding: 16px 14px; }
  .section-title { font-size: 16px; letter-spacing: 3px; }
}
@media (max-width: 480px) {
  .entry { border-width: 5px; padding: 14px 12px; }
}
  </style>
</head>
<body>
  <aside class="sidebar" id="siteSidebar" aria-hidden="true">
    <button class="close" aria-label="Close menu">×</button>
    <nav aria-label="Main navigation">
      <a href="https://k1llajay.com">Home</a>

    </nav>
  </aside>

  <div class="top-bar">
    <button class="menu-btn" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="top-bar-title">JAE LAURENT</div>
  </div>

  <div class="main-content">
    <div id="musicDatabase"></div>
  </div>

  <footer class="footer">
    © 2025 Jefferson Entertainment LLC •
    <a href="https://k1llajay.com/extras/terms">Terms</a> •

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script>
    let showAllReleased = false;
    let showAllUnreleased = false;

    const firebaseConfig = {
      apiKey: "AIzaSyDf2Caujz2FQuUDtzDr8eArpmaHXX_vsVY",
      authDomain: "music-database-3ee0a.firebaseapp.com",
      databaseURL: "https://music-database-3ee0a-default-rtdb.firebaseio.com",
      projectId: "music-database-3ee0a",
      storageBucket: "music-database-3ee0a.firebasestorage.app",
      messagingSenderId: "148257189959",
      appId: "1:148257189959:web:3e52404367191d5835c162"
    };
    firebase.initializeApp(firebaseConfig);

    const dbRef = firebase.database().ref('musicDatabase');
    const entries = [];

    function formatDateMMDDYYYY(dateValue) {
      if (!dateValue) return '';
      const date = new Date(dateValue);
      if (isNaN(date)) return dateValue;
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const year = date.getFullYear();
      return `${month}/${day}/${year}`;
    }

    function normalizeName(str) {
      if (!str) return '';
      return String(str).toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
    }

    function getTrackCount(e) {
      const t = e.tracks;
      if (typeof t === 'number' && t > 0) return t;
      if (typeof t === 'string' && /^\d+$/.test(t)) return parseInt(t, 10);
      const list = e.tracklist || e.tracksArray || e.trackList || e.tracksList;
      if (Array.isArray(list) && list.length) return list.length;
      return 1;
    }

    function isSingle(e) {
      return getTrackCount(e) === 1 || String(e.type || '').toLowerCase() === 'single';
    }

    function extractTracks(e) {
      const byNum = {};

      const map = e.trackISRCs || e.isrcs || e.track_isrcs || e.trackIsrcs;
      if (map && typeof map === 'object' && !Array.isArray(map)) {
        Object.keys(map).forEach(key => {
          const num = Number(key);
          if (!isNaN(num) && map[key]) {
            byNum[num] = { trackNum: num, title: null, isrc: String(map[key]).trim() };
          }
        });
      }

      const list = e.tracklist || e.tracksArray || e.trackList || e.tracksList;
      if (Array.isArray(list) && list.length) {
        list.forEach((t, i) => {
          const num = Number(t.number || t.track || t.num || t.trackNumber || (i + 1));
          const title = t.title || t.name || t.trackTitle || null;
          const isrc = t.isrc || t.ISRC || t.isrcCode || null;
          byNum[num] = {
            trackNum: num,
            title: title ? String(title).trim() : (byNum[num] && byNum[num].title) || null,
            isrc: isrc ? String(isrc).trim() : (byNum[num] && byNum[num].isrc) || null
          };
        });
      }

      for (let i = 1; i <= 50; i++) {
        const isrc = e[`isrc${i}`] || e[`ISRC${i}`] || e[`track${i}Isrc`];
        const title = e[`title${i}`] || e[`track${i}Title`] || e[`trackTitle${i}`];
        if (isrc || title) {
          byNum[i] = {
            trackNum: i,
            title: title ? String(title).trim() : (byNum[i] && byNum[i].title) || null,
            isrc: isrc ? String(isrc).trim() : (byNum[i] && byNum[i].isrc) || null
          };
        }
      }

      if (Object.keys(byNum).length === 0 && e.isrc) {
        byNum[1] = { trackNum: 1, title: e.title || null, isrc: String(e.isrc).trim() };
      }

      return Object.values(byNum).sort((a, b) => a.trackNum - b.trackNum);
    }

    function buildSingleISRCMap(allEntries) {
      const map = {};
      allEntries.forEach(e => {
        if (!isSingle(e)) return;
        const tracks = extractTracks(e);
        tracks.forEach(t => {
          const name = t.title || e.title;
          if (name && t.isrc) map[normalizeName(name)] = t.isrc;
        });
        if (e.title && e.isrc) map[normalizeName(e.title)] = e.isrc;
      });
      return map;
    }

    function getAllTracks(e, singleMap) {
      const count = getTrackCount(e);
      const existing = extractTracks(e);
      const byNum = {};
      existing.forEach(t => { byNum[t.trackNum] = t; });

      const result = [];
      for (let i = 1; i <= count; i++) {
        let t = byNum[i] || { trackNum: i, title: null, isrc: null };
        if (!t.isrc && t.title && singleMap) {
          const key = normalizeName(t.title);
          if (singleMap[key]) t = { ...t, isrc: singleMap[key], copiedFromSingle: true };
        }
        result.push(t);
      }
      return result;
    }

    /* ISRC block – closed shows "ISRC: ▾", open shows the list */
    function buildIsrcBlock(e, singleMap) {
      if (isSingle(e)) {
        return e.isrc ? `<p>ISRC: ${e.isrc}</p>` : '';
      }

      const tracks = getAllTracks(e, singleMap);
      if (!tracks.length) {
        return `
          <div class="isrc-row">
            <span class="isrc-label">ISRC:</span>
          </div>
        `;
      }

      const items = tracks.map(t => {
        const num = t.trackNum;
        const name = t.title || '—';
        const isrc = t.isrc
          ? `${t.isrc}${t.copiedFromSingle ? ' <span class="from-single">(from single)</span>' : ''}`
          : '(no ISRC yet)';
        return `<div class="track-list-item">${num}. ${name} - ${isrc}</div>`;
      }).join('');

      return `
        <div class="isrc-row">
          <span class="isrc-label">ISRC:</span>
          <button type="button" class="track-toggle-btn" aria-expanded="false">▾</button>
        </div>
        <div class="track-list">${items}</div>
      `;
    }

    function render() {
      const grid = document.getElementById('musicDatabase');
      grid.innerHTML = '';

      const singleMap = buildSingleISRCMap(entries);

      const released = entries.filter(e => !e.unreleased);
      const unreleased = entries.filter(e => e.unreleased);

      const sortByDate = (a, b) => {
        const da = a.releaseDate ? new Date(a.releaseDate) : 0;
        const db = b.releaseDate ? new Date(b.releaseDate) : 0;
        return da - db;
      };
      released.sort(sortByDate);
      unreleased.sort(sortByDate);

      const releasedToShow = showAllReleased ? released : released.slice(-3).reverse();
      const unreleasedToShow = (showAllUnreleased || unreleased.length < 4)
        ? unreleased
        : unreleased.slice(-3).reverse();

      /* RELEASED */
      if (released.length) {
        grid.innerHTML += `
          <div class="section-header">
            <div class="section-title">RELEASED</div>
            <button onclick="toggleReleased()">${showAllReleased ? 'Hide All' : 'Show All'}</button>
          </div>
        `;
        releasedToShow.forEach(e => {
          grid.innerHTML += `
            <div class="entry">
              <h2>${e.title} — ${e.artist}</h2>
              ${e.releaseDate ? `<p>DATE: ${formatDateMMDDYYYY(e.releaseDate)}</p>` : ''}
              ${e.upc ? `<p>UPC: ${e.upc}</p>` : ''}
              ${buildIsrcBlock(e, singleMap)}
              <p>Tracks: ${getTrackCount(e)}</p>
            </div>
          `;
        });
      }

      /* UNRELEASED */
      if (unreleased.length) {
        const showUnreleasedButton = unreleased.length >= 4;
        grid.innerHTML += `
          <div class="section-header">
            <div class="section-title">UNRELEASED</div>
            ${showUnreleasedButton ? `
              <button onclick="toggleUnreleased()">${showAllUnreleased ? 'Hide All' : 'Show All'}</button>
            ` : ''}
          </div>
        `;
        unreleasedToShow.forEach(e => {
          grid.innerHTML += `
            <div class="entry">
              <h2>${e.title} — ${e.artist} <span class="unreleased-tag">(Unreleased)</span></h2>
              ${e.releaseDate ? `<p>DATE: ${formatDateMMDDYYYY(e.releaseDate)}</p>` : ''}
              ${e.upc ? `<p>UPC: ${e.upc}</p>` : ''}
              ${buildIsrcBlock(e, singleMap)}
              <p>Tracks: ${getTrackCount(e)}</p>
            </div>
          `;
        });
      }
    }

    function toggleReleased() {
      showAllReleased = !showAllReleased;
      render();
    }
    function toggleUnreleased() {
      showAllUnreleased = !showAllUnreleased;
      render();
    }

    /* Toggle the ISRC list */
    document.getElementById('musicDatabase').addEventListener('click', (e) => {
      const btn = e.target.closest('.track-toggle-btn');
      if (!btn) return;
      const entry = btn.closest('.entry');
      const list = entry.querySelector('.track-list');
      if (!list) return;

      const isOpen = list.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
      btn.setAttribute('aria-expanded', isOpen);
      btn.textContent = isOpen ? '▴' : '▾';
    });

    /* Sidebar */
    (function(){
      const sidebar = document.getElementById('siteSidebar');
      const closeBtn = sidebar && sidebar.querySelector('.close');
      const menuButtons = Array.from(document.querySelectorAll('.menu-btn'));

      function openMenu(){
        if (!sidebar) return;
        sidebar.classList.add('open', 'active');
        document.body.classList.add('menu-open');
        sidebar.setAttribute('aria-hidden','false');
      }
      function closeMenu(){
        if (!sidebar) return;
        sidebar.classList.remove('open', 'active');
        document.body.classList.remove('menu-open');
        sidebar.setAttribute('aria-hidden','true');
      }

      menuButtons.forEach(btn => { if (btn) btn.addEventListener('click', openMenu); });
      if (closeBtn) closeBtn.addEventListener('click', closeMenu);

      document.addEventListener('click', function(e){
        if (!sidebar) return;
        const clickedMenuButton = menuButtons.some(btn => btn && btn.contains(e.target));
        if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !clickedMenuButton) {
          closeMenu();
        }
      });
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape') closeMenu();
      });
    })();

    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        entries.length = 0;
        Object.values(data).forEach(item => entries.push(item));
        render();
      }
    });
  </script>
