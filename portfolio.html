<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Natural Photography Gallery – Jae Laurent</title>
  <link rel="icon" href="images/favicon.ico">
  <style>
@font-face {font-family: 'sitefont'; src: url('font/kobuzan-cy-grotesk-grand-dark.otf') format('truetype');}
@font-face {font-family: 'altfont'; src: url('font/TT-Commons-Pro-Bold-GFXTRA.COM-iF66f11118bc78d.ttf') format('truetype');}

/* ================= RESET ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100dvh;
  font-family: 'sitefont', monospace;
  color: white;
  background: #000000;
}

html {
  height: 100vh;
  height: 100dvh;
}

/* ================= TOP BAR ================= */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 76px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: url("images/IMG_4619.png") center / cover no-repeat;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 20;
}

.top-bar .menu-btn {
  position: absolute;
  left: 24px;
}

.top-bar-title {
  font-family: 'altfont', sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #ffe600;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 0 18px rgba(255, 230, 0, 0.35);
}

/* Menu button */
.menu-btn {
  width: 44px;
  height: 36px;
  padding: 8px;
  display: flex !important;
  flex-direction: column;
  justify-content: space-between;
  z-index: 999;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 230, 0, 0.5);
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.menu-btn span {
  display: block;
  width: 100%;
  height: 4px;
  background: #ffe600;
  border-radius: 999px;
}

body.menu-open .menu-btn {
  display: none !important;
}

/* ================= SIDEBAR ================= */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 280px;
  height: 100%;
  background: #071123;
  color: #ffe600;
  padding: 24px;
  box-shadow: 2px 0 18px rgba(0, 0, 0, 0.6);
  transition: transform .28s ease, opacity .28s ease, visibility .28s ease;
  z-index: 30;
  overflow: auto;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.sidebar.active,
.sidebar.open {
  transform: translateX(0);
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.sidebar .close {
  position: absolute;
  right: 12px;
  top: 12px;
  background: transparent;
  border: 0;
  color: #ffe600;
  font-size: 24px;
  cursor: pointer;
}

.sidebar nav {
  margin-top: 36px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sidebar a {
  color: #ffe600;
  text-decoration: none;
  padding: 6px 8px;
  border-radius: 6px;
  transition: background 0.2s ease;
}

.sidebar a:hover {
  background: rgba(255, 230, 0, 0.1);
  text-decoration: none;
}

/* ================= BODY ================= */
body {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  position: relative;
  overflow-x: hidden;
  background: #000;
}

/* ================= MAIN GRID (FILMSTRIP STYLE) ================= */
.main-content {
  flex: 1;
  padding: 100px 20px 50px;
  display: grid;
  grid-template-columns: repeat(5, 1fr); /* Desktop: 5 columns */
  gap: 16px;
  max-width: 1600px;
  margin: 0 auto;
  width: 100%;
}

.main-content::-webkit-scrollbar { display: none; }
.main-content { -ms-overflow-style: none; scrollbar-width: none; }

/* Film frame base */
.grid-item {
  position: relative;
  aspect-ratio: 3 / 4;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.35s ease;
  box-shadow: 
    0 6px 24px rgba(0, 0, 0, 0.7),
    inset 0 0 0 1px rgba(0, 0, 0, 0.03);
}

/* ===== DESKTOP (5 columns) =====
   Row 1: Black, Blue, Black, Blue, Black
   Row 2: Blue, Black, Blue, Black, Blue
   (odd = black, even = blue works perfectly with 5 columns)
*/
.grid-item:nth-child(odd) {
  border: 10px solid #000000;
  padding: 6px;
  background: #000000;
}

.grid-item:nth-child(even) {
  border: 10px solid #0a1a3a;
  padding: 6px;
  background: #0a1a3a;
}

/* Inner image */
.grid-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 6px;
  transition: opacity 0.3s ease, transform 0.5s ease;
}

.grid-item:hover {
  transform: scale(1.04) translateY(-6px);
  box-shadow: 
    0 16px 40px rgba(0, 0, 0, 0.8),
    0 0 0 1px rgba(255, 230, 0, 0.25),
    0 0 30px rgba(255, 230, 0, 0.12);
}

.grid-item:hover img {
  opacity: 0.92;
  transform: scale(1.04);
}

/* ================= MODAL ================= */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  align-items: center;
  justify-content: center;
}

.modal.open {
  display: flex;
}

.modal-content {
  max-width: 90vw;
  max-height: 85vh;
  object-fit: contain;
  border: 8px solid #0a0a0a;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
}

.modal .close {
  position: fixed;
  top: 24px;
  right: 28px;
  font-size: 36px;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #ffe600;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 230, 0, 0.4);
  border-radius: 50%;
  z-index: 101;
  transition: all 0.25s ease;
}

.modal .close:hover {
  background: rgba(255, 230, 0, 0.15);
  transform: scale(1.08);
}

/* ================= FOOTER ================= */
.footer {
  max-width: 1200px;
  width: 100%;
  margin: 10px auto 40px;
  color: rgba(255, 255, 255, 0.7);
  padding: 20px 24px;
  text-align: center;
  font-size: 13px;
  letter-spacing: 0.5px;
}

.footer a {
  color: #ffe600;
  text-decoration: none;
}

.footer a:hover {
  text-decoration: underline;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 1200px) {
  .main-content {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width: 900px) {
  .main-content {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* ===== MOBILE: custom pattern =====
   1st & 4th → black
   2nd & 3rd → blue
   (repeats every 4 items)
*/
@media (max-width: 768px) {
  .main-content {
    padding: 92px 12px 30px;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  /* Reset desktop rules */
  .grid-item:nth-child(odd),
  .grid-item:nth-child(even) {
    border: none;
    padding: 0;
    background: transparent;
  }

  /* Black frames: 1st, 4th, 5th, 8th, 9th... */
  .grid-item:nth-child(4n+1),
  .grid-item:nth-child(4n) {
    border: 7px solid #000000;
    padding: 4px;
    background: #000000;
    border-radius: 11px;
  }

  /* Blue frames: 2nd, 3rd, 6th, 7th... */
  .grid-item:nth-child(4n+2),
  .grid-item:nth-child(4n+3) {
    border: 7px solid #0a1a3a;
    padding: 4px;
    background: #0a1a3a;
    border-radius: 11px;
  }

  .top-bar-title {
    font-size: 18px;
    letter-spacing: 2px;
  }

  .modal-content {
    max-width: 94vw;
    max-height: 75vh;
    border-width: 6px;
  }

  .modal .close {
    top: 16px;
    right: 16px;
  }
}

@media (max-width: 480px) {
  .main-content {
    gap: 10px;
  }

  .grid-item:nth-child(4n+1),
  .grid-item:nth-child(4n),
  .grid-item:nth-child(4n+2),
  .grid-item:nth-child(4n+3) {
    border-width: 6px;
    padding: 3px;
  }
}
  </style>
</head>

  <script>
  /* === MODAL === */
  const modal = document.getElementById("myModal");
  const modalImg = document.getElementById("img01");
  const modalClose = modal.querySelector(".close");
  const gridContainer = document.getElementById("grid-container");

  gridContainer.addEventListener("click", (e) => {
    if (e.target.tagName === "IMG") {
      // close sidebar if open
      document.getElementById("siteSidebar").classList.remove("active", "open");
      document.body.classList.remove("menu-open");
      
      modal.classList.add("open");
      modalImg.src = e.target.src;
    }
  });

  modalClose.onclick = () => modal.classList.remove("open");
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.classList.remove("open");
  });

  /* === SIDEBAR MENU === */
  (function(){
    const sidebar = document.getElementById('siteSidebar');
    const closeBtn = sidebar && sidebar.querySelector('.close');
    const menuButtons = Array.from(document.querySelectorAll('.menu-btn'));

    function openMenu(){
      if (!sidebar) return;
      sidebar.classList.add('open', 'active');
      document.body.classList.add('menu-open');
      sidebar.setAttribute('aria-hidden','false');
    }

    function closeMenu(){
      if (!sidebar) return;
      sidebar.classList.remove('open', 'active');
      document.body.classList.remove('menu-open');
      sidebar.setAttribute('aria-hidden','true');
    }

    menuButtons.forEach(btn => {
      if (btn) btn.addEventListener('click', openMenu);
    });

    if (closeBtn) closeBtn.addEventListener('click', closeMenu);

    document.addEventListener('click', function(e){
      if (!sidebar) return;
      const clickedMenuButton = menuButtons.some(btn => btn && btn.contains(e.target));
      if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !clickedMenuButton) {
        closeMenu();
      }
    });

    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') closeMenu();
    });
  })();
  </script>
