/* ================= RESET ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100dvh;
  font-family: 'sitefont', monospace;
  color: white;
  background: #000000;
}
html {
  height: 100vh;
  height: 100dvh;
  padding-top: 0;
}

.sidebar {
  display: flex !important;
  visibility: hidden;
  pointer-events: none;
  opacity: 0;
  transform: translateX(-100%);
}

.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 76px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: url("images/IMG_4619.png") center / cover no-repeat;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 20;
}
.top-bar .menu-btn {
  position: absolute;
  left: 24px;
}
.top-bar-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #ffe600;
  text-align: center;
  white-space: nowrap;
}

.menu-btn {
  width: 44px;
  height: 36px;
  padding: 8px;
  display: flex !important;
  flex-direction: column;
  justify-content: space-between;
  z-index: 999;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 230, 0, 0.5);
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  background-clip: padding-box;
}
.menu-btn span {
  display: block;
  width: 100%;
  height: 4px;
  background: #ffe600;
  border-radius: 999px;
}
.menu-btn:focus {
  outline: 2px solid rgba(255, 230, 0, 0.35);
}
body.menu-open .menu-btn {
  display: none !important;
}

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 280px;
  height: 100%;
  background: #071123;
  color: #ffe600;
  padding: 24px;
  box-shadow: 2px 0 18px rgba(0, 0, 0, 0.6);
  transition: transform .28s ease, opacity .28s ease, visibility .28s ease;
  z-index: 30;
  overflow: auto;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.sidebar.active{transform:translateX(0);opacity:1;visibility:visible;pointer-events:auto}
.sidebar .close{position:absolute;right:12px;top:12px;background:transparent;border:0;color:#ffe600;font-size:24px;cursor:pointer}
.sidebar nav{margin-top:36px;display:flex;flex-direction:column;gap:12px}
.sidebar a{color:#ffe600;text-decoration:none;padding:6px 8px;border-radius:6px}
.sidebar a:hover{text-decoration:underline}
.footer{max-width:1200px;width:100%;margin:20px 0 30px;color:#fff;padding:20px 24px;text-align:left!important;display:block;line-height:1.6;align-self:flex-start}

/* ================= BODY ================= */
body {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  position: relative;
  overflow-x: hidden;
}

/* ================= PAGE LAYOUT ================= */
.main-content::-webkit-scrollbar { display: none; }
.main-content { -ms-overflow-style: none; scrollbar-width: none; }
.main-content {
  flex: 1;
  padding: 110px 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

.page-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-direction: column;
  position: relative;
  padding-top: 20px;
  padding-bottom: 20px;
}

.page-title {
  font-size: 72px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #ffe600;
  text-align: center;
}

.page-subtitle {
  font-size: 20px;
  letter-spacing: 3px;
  color: rgba(255,230,0,0.95);
  align-items: start;
}

.album-cover {
  width: 100%;
  aspect-ratio: 1/1;
  border-radius: 36px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255,255,255,0.12);
}

.album-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.album-meta {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}

.album-heading {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.album-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.album-title-toggle {
  background: transparent;
  border: none;
  color: #ffe600;
  font-size: 20px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}

.album-heading .album-label {
  font-size: 58px;
  font-weight: 900;
  color: #ffe600;
  letter-spacing: 1.4px;
}

.album-heading .album-artist {
  font-size: 28px;
  line-height: 1.05;
  letter-spacing: 1.8px;
  color: white;
  text-transform: uppercase;
}

.album-meta.collapsed .album-data-grid {
  max-height: 0;
  opacity: 0;
  transform: translateY(-10px);
  pointer-events: none;
}

.album-data-grid {
  display: grid;
  grid-template-columns: minmax(280px, 1fr) minmax(320px, 1fr);
  gap: 18px;
  overflow: hidden;
  max-height: 1000px;
  opacity: 1;
  transform: translateY(0);
  transition: max-height 0.35s ease, opacity 0.28s ease, transform 0.35s ease;
}

.meta-column {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.meta-column h3 {
  font-size: 14px;
  letter-spacing: 3px;
  color: #ffe600;
  margin-bottom: 6px;
}

.meta-column ul,
.meta-column ol {
  list-style-position: outside;
  color: white;
  font-size: 14px;
  line-height: 1.8;
  padding-left: 25px;
  display: grid;
  gap: 4px;
}

.meta-column ul {
  list-style-type: disc;
}

.meta-column ol {
  list-style-type: decimal;
}

.meta-column ul li,
.meta-column ol li {
  opacity: 0.95;
}

.tracklist-panel {
  display: flex;
  flex-direction: column;
  gap: 24px;
  background: #071123;
  border-radius: 28px;
  padding: 32px;
}

.hero-grid {
  display: grid;
  grid-template-columns: minmax(320px, 420px) minmax(320px, 1fr);
  gap: 48px;
  align-items: start;
}

.album-card {
  display: flex;
  flex-direction: column;
  gap: 28px;
  background: #071123;
  border-radius: 28px;
  padding: 28px;
}

.album-meta {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}

.album-data-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.meta-column {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.meta-column h3 {
  font-size: 14px;
  letter-spacing: 3px;
  color: #ffe600;
  margin-bottom: 6px;
}

.meta-column ul {
  list-style: none;
  color: white;
  font-size: 14px;
  line-height: 1.8;
  padding-left: 0px;
  display: grid;
  gap: 4px;
}

.meta-column ul li {
  opacity: 0.95;
}

.tracklist-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.tracklist-header h2 {
  font-size: 52px;
  letter-spacing: 2px;
  color: #ffe600;
  margin: 0;
}

.tracklist {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.track {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 20px;
  align-items: baseline;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.track-number {
  font-size: 16px;
  font-weight: 700;
  opacity: 0.9;
  min-width: 28px;
}

.track-title {
  font-size: 18px;
  line-height: 1.3;
  color: #ffe600;
}

.track-extra {
  font-size: 12px;
  opacity: 0.65;
  margin-top: 4px;
}

@media (max-width: 980px) {
  .hero-grid {
    grid-template-columns: 1fr;
  }
  .album-data-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .main-content {
    padding: 100px 0px 0px;
  }

  }

  .hero-grid {

  }

  .album-cover {
    border-radius: 28px;
  }

  .album-heading .album-artist {
    font-size: 32px;
  }

  .meta-grid {
    grid-template-columns: 1fr;
  }

  .tracklist-header h2 {
    font-size: 36px;
  }
}



/* Mobile */
@media (max-width: 768px) {

  }

  }

@media (max-width: 900px) {

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyDf2Caujz2FQuUDtzDr8eArpmaHXX_vsVY",
      authDomain: "music-database-3ee0a.firebaseapp.com",
      databaseURL: "https://music-database-3ee0a-default-rtdb.firebaseio.com",
      projectId: "music-database-3ee0a",
      storageBucket: "music-database-3ee0a.firebasestorage.app",
      messagingSenderId: "148257189959",
      appId: "1:148257189959:web:3e52404367191d5835c162"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const albumRef = db.ref('album');
    const tracksRef = db.ref('tracks');

    let albumData = { title: 'SOS', artist: 'Jae Laurent' };
    let trackData = {};
    let trackKeys = [];

    function updatePageTitle() {
      const title = albumData.title || 'SOS';
      document.title = `${title} – Jae Laurent`;
    }

    function updateAlbumHeader() {
      const labelEl = document.getElementById('album-label');
      const artistEl = document.getElementById('album-artist');
      const pageArtistEl = document.getElementById('pageArtist');
      const pageAlbumEl = document.getElementById('pageAlbum');
      if (labelEl) labelEl.textContent = albumData.title || 'SOS';
      if (artistEl) artistEl.textContent = albumData.artist || 'Jae Laurent';
      if (pageArtistEl) pageArtistEl.textContent = albumData.artist || 'Jae Laurent';
      if (pageAlbumEl) pageAlbumEl.textContent = albumData.title || 'SOS';
    }

    function parseLocalDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split('-').map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function shouldShowTrack(track) {
      if (!track || !track.scheduleEnabled) return true;
      const scheduledFor = parseLocalDate(track.scheduleDate);
      if (!scheduledFor) return true;

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return scheduledFor <= today;
    }


    // Load album data
    albumRef.on('value', snap => {
      albumData = snap.val() || { title: 'SOS', artist: 'Jae Laurent' };
      updatePageTitle();
      updateAlbumHeader();
    });

    // Load tracks (sort by number)
    tracksRef.on('value', snap => {
      const val = snap.val() || {};
      // Sort both keys and tracks by track number
      const entries = Object.entries(val).map(([k, v]) => [k, v]);
      entries.sort((a, b) => (a[1].number || 0) - (b[1].number || 0));

      const visibleEntries = entries.filter(([, v]) => shouldShowTrack(v));

      trackKeys = visibleEntries.map(([k]) => k);
      trackData = {};
      visibleEntries.forEach(([k, v]) => { trackData[k] = v; });
      renderTracklist();
    });

    function parseListValues(rawValue) {
      if (!rawValue) return [];
      return String(rawValue)
        .split(/[,&/;]+/)
        .map(value => value.trim())
        .filter(Boolean);
    }

    function dedupeValues(values) {
      const seen = new Set();
      return values.filter(value => {
        const normalized = value.trim().toLowerCase();
        if (!normalized || seen.has(normalized)) return false;
        seen.add(normalized);
        return true;
      });
    }

    function populateMetadataLists() {
      const producerList = document.getElementById('producerList');
      const sampleList = document.getElementById('sampleList');
      const featureList = document.getElementById('featureList');
      const featureBlock = document.querySelector('[data-feature-block]');

      const producedValues = [];
      const sampledValues = [];
      const featureValues = [];

      trackKeys.forEach(key => {
        const track = trackData[key] || {};
        const rawProduced = track.creditProduced || albumData.artist || 'Jae Laurent';
        const rawSampled = track.creditSampled || '';
        const rawFeature = track.feature || '';

        producedValues.push(...parseListValues(rawProduced));
        sampledValues.push(...parseListValues(rawSampled));
        featureValues.push(...parseListValues(rawFeature));
      });

      const uniqueProduced = dedupeValues(producedValues);
      const uniqueSampled = dedupeValues(sampledValues);
      const uniqueFeatures = dedupeValues(featureValues.filter(value => {
        const normalized = value.toLowerCase();
        return normalized !== 'undefined' && normalized !== 'unknown' && normalized !== String(albumData.artist || '').toLowerCase();
      }));

      if (producerList) {
        producerList.innerHTML = '';
        uniqueProduced.forEach(value => {
          const item = document.createElement('li');
          item.textContent = value;
          producerList.appendChild(item);
        });
      }

      if (sampleList) {
        sampleList.innerHTML = '';
        uniqueSampled.forEach(value => {
          const item = document.createElement('li');
          item.textContent = value;
          sampleList.appendChild(item);
        });
      }

      if (featureList) {
        featureList.innerHTML = '';
        uniqueFeatures.forEach(value => {
          const item = document.createElement('li');
          item.textContent = value;
          featureList.appendChild(item);
        });
      }

      if (featureBlock) {
        featureBlock.style.display = uniqueFeatures.length ? '' : 'none';
      }
    }

    function renderTracklist() {
      const tracklist = document.getElementById('tracklist');
      tracklist.innerHTML = '';
      trackKeys.forEach(key => {
        const track = trackData[key];
        const explicitSymbol = track.explicit ? ' 🄴' : '';
        const rawFeature = String(track.feature || '').trim();
        const lowerFeature = rawFeature.toLowerCase();
        const lowerAlbumArtist = String(albumData.artist || '').toLowerCase();
        const validFeature = rawFeature && lowerFeature !== 'undefined' && lowerFeature !== 'unknown' && lowerFeature !== lowerAlbumArtist;
        const featureText = validFeature ? ` With ${rawFeature}` : '';
        tracklist.innerHTML += `
          <div class="track">
            <div class="track-number">${track.number || '?' }.</div>
            <div class="track-title">${track.title || 'Untitled'}${featureText}${explicitSymbol}</div>
          </div>
        `;
      });
      populateMetadataLists();
    }

    const menuButton = document.querySelector('.menu-btn');
    const sidebarEl = document.querySelector('.sidebar');
    const albumMetaEl = document.querySelector('.album-meta');
    const albumToggleBtn = document.getElementById('albumToggle');

    if (menuButton && sidebarEl) {
      menuButton.addEventListener('click', () => {
        sidebarEl.classList.toggle('active');
        document.body.classList.toggle('menu-open');
      });
    }
    const closeBtn = document.querySelector('.sidebar .close');
    if (closeBtn && sidebarEl) {
      closeBtn.addEventListener('click', () => {
        sidebarEl.classList.remove('active');
        document.body.classList.remove('menu-open');
      });
    }

    if (albumToggleBtn && albumMetaEl) {
      albumToggleBtn.addEventListener('click', () => {
        const isCollapsed = albumMetaEl.classList.toggle('collapsed');
        albumToggleBtn.textContent = isCollapsed ? '▸' : '▾';
        albumToggleBtn.setAttribute('aria-expanded', String(!isCollapsed));
      });
    }

    // Initial title (will be updated once data loads)
    updatePageTitle();
</script>
