<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>404 | Page Not Found</title>
<link rel="icon" href="images/favicon.ico">
<style>
@font-face {font-family: 'sitefont'; src: url('font/kobuzan-cy-grotesk-grand-dark.otf') format('truetype');}
@font-face {font-family: 'altfont'; src: url('font/TT-Commons-Pro-Bold-GFXTRA.COM-iF66f11118bc78d.ttf') format('truetype');}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100dvh;font-family:'sitefont',monospace;color:white;background:#000}
body{display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* Top bar */
.top-bar{position:fixed;top:0;left:0;right:0;height:76px;padding:0 24px;display:flex;align-items:center;justify-content:center;background:url("images/IMG_4619.png") center/cover no-repeat;border-bottom:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:20}
.top-bar .menu-btn{position:absolute;left:24px}
.top-bar-title{font-family:'altfont';font-size:22px;font-weight:800;letter-spacing:2px;color:#ffe600;text-align:center;white-space:nowrap;text-transform:uppercase}

/* Hamburger button */
.menu-btn{width:44px;height:36px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(0,0,0,0.35);border:1px solid rgba(255,230,0,0.5);border-radius:12px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background-clip:padding-box}
.menu-btn span{display:block;width:100%;height:4px;background:#ffe600;border-radius:999px}
.menu-btn:focus{outline:2px solid rgba(255,230,0,0.35)}
body.menu-open .menu-btn{visibility:hidden}

/* Sidebar */
.sidebar{position:fixed;left:0;top:0;width:280px;height:100%;background:#071123;color:#ffe600;padding:24px;box-shadow:2px 0 18px rgba(0,0,0,0.6);transition:transform .28s ease,opacity .28s ease,visibility .28s ease;z-index:30;overflow:auto;display:flex;flex-direction:column;transform:translateX(-100%);opacity:0;visibility:hidden;pointer-events:none}
.sidebar.open{transform:translateX(0);opacity:1;visibility:visible;pointer-events:auto}
.sidebar .close{position:absolute;right:12px;top:12px;background:transparent;border:0;color:#ffe600;font-size:24px;cursor:pointer}
.sidebar nav{margin-top:36px;display:flex;flex-direction:column;gap:12px}
.sidebar a{color:#ffe600;padding:6px 8px;border-radius:6px}
.sidebar a:hover{text-decoration:underline}

/* Page */
.main-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:110px 24px 40px;text-align:center}
.error-code{font-family:'altfont';font-size:160px;line-height:1;letter-spacing:6px;color:#ffe600}
.error-text{font-size:20px;letter-spacing:3px;text-transform:uppercase;color:white;opacity:0.95;margin-bottom:16px}
.home-btn{background:transparent;border:2px solid #ffe600;color:#ffe600;padding:8px 14px;border-radius:24px;font-weight:500;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.home-btn:hover{background:rgba(255,230,0,0.1)}

.footer{max-width:1200px;width:100%;margin:40px auto;color:#fff;padding:24px}
.footer a{color:#ffe600}

@media(max-width:768px){
  .error-code{font-size:96px;letter-spacing:3px}
  .error-text{font-size:16px}
  .footer{padding:20px;margin:30px auto}
}
</style>
</head>
<body>

<aside class="sidebar" id="siteSidebar" aria-hidden="true">
  <button class="close" aria-label="Close menu">×</button>
  <nav aria-label="Main navigation">
    <a href="https://k1llajay.com">Home</a>
    <a href="https://k1llajay.com/music">Latest Album</a>
    <a href="https://k1llajay.com/portfolio">Natural Photography</a>
    <a href="https://k1llajay.com/podcast">Trend Talk</a>
    <a href="https://k1llajay.com/extras/database">Catelog Database</a>
    <a href="https://k1llajay.com/extras/events">Events</a>
    <a href="https://k1llajay.com/404">Coming Soon</a>
  </nav>
</aside>

<div class="top-bar">
  <button class="menu-btn" aria-label="Open menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="top-bar-title">JAE LAURENT</div>
</div>

<main class="main-content">
  <div class="error-code">404</div>
  <p class="error-text">Page Not Found</p>
  <a class="home-btn" href="https://k1llajay.com/">Back Home →</a>
</main>

<footer class="footer">
  © 2026 Jefferson Entertainment LLC • <a href="https://k1llajay.com/extras/terms">Terms</a> • <a href="https://k1llajay.com/extras/privacy">Privacy</a> <a href="https://k1llajay.com/editor/editor-home" style="color:#000000">___</a>
</footer>

<script>
  (function(){
    const sidebar = document.getElementById('siteSidebar');
    const close = sidebar.querySelector('.close');
    const menuButton = document.querySelector('.menu-btn');

    function open(){
      sidebar.classList.add('open');
      document.body.classList.add('menu-open');
      sidebar.setAttribute('aria-hidden','false');
    }

    function closeMenu(){
      sidebar.classList.remove('open');
      document.body.classList.remove('menu-open');
      sidebar.setAttribute('aria-hidden','true');
    }

    menuButton.addEventListener('click', open);
    close.addEventListener('click', closeMenu);
    document.addEventListener('click', function(e){
      if(sidebar.classList.contains('open') && !sidebar.contains(e.target) && !menuButton.contains(e.target)) closeMenu();
    });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeMenu(); });
  })();
</script>
</body>
</html>
