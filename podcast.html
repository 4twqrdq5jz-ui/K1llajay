/* ================= RESET ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100dvh;
  font-family: 'sitefont', monospace;
  color: white;
  background: #000000;
}

html {
  height: 100vh;
  height: 100dvh;
}

/* ================= TOP BAR ================= */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 76px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: url("images/IMG_4619.png") center / cover no-repeat;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 20;
}

.top-bar .menu-btn {
  position: absolute;
  left: 24px;
}

.top-bar-title {
  font-family: 'altfont', sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #ffe600;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 0 18px rgba(255, 230, 0, 0.35);
}

/* Menu button */
.menu-btn {
  width: 44px;
  height: 36px;
  padding: 8px;
  display: flex !important;
  flex-direction: column;
  justify-content: space-between;
  z-index: 999;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 230, 0, 0.5);
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.menu-btn span {
  display: block;
  width: 100%;
  height: 4px;
  background: #ffe600;
  border-radius: 999px;
}

body.menu-open .menu-btn {
  display: none !important;
}

/* ================= SIDEBAR ================= */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 280px;
  height: 100%;
  background: #071123;
  color: #ffe600;
  padding: 24px;
  box-shadow: 2px 0 18px rgba(0, 0, 0, 0.6);
  transition: transform .28s ease, opacity .28s ease, visibility .28s ease;
  z-index: 30;
  overflow: auto;
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.sidebar.active,
.sidebar.open {
  transform: translateX(0);
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.sidebar .close {
  position: absolute;
  right: 12px;
  top: 12px;
  background: transparent;
  border: 0;
  color: #ffe600;
  font-size: 24px;
  cursor: pointer;
}

.sidebar nav {
  margin-top: 36px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sidebar a {
  color: #ffe600;
  text-decoration: none;
  padding: 6px 8px;
  border-radius: 6px;
  transition: background 0.2s ease;
}

.sidebar a:hover {
  background: rgba(255, 230, 0, 0.1);
  text-decoration: none;
}

/* ================= BODY ================= */
body {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  position: relative;
  overflow-x: hidden;
  background: #000;
}

/* ================= MAIN CONTENT ================= */
.main-content {
  flex: 1;
  padding: 100px 20px 50px;
  max-width: 1600px;
  margin: 0 auto;
  width: 100%;
}

/* Podcast header */
.podcast-header {
  text-align: center;
  margin-bottom: 48px;
}

.podcast-header h1 {
  font-family: 'altfont', sans-serif;
  font-size: clamp(32px, 6vw, 52px);
  font-weight: 800;
  letter-spacing: 4px;
  color: #ffe600;
  text-shadow: 0 0 28px rgba(255, 230, 0, 0.4);
  margin-bottom: 10px;
}

.podcast-header p {
  font-size: 15px;
  letter-spacing: 2px;
  color: rgba(255, 255, 255, 0.65);
  text-transform: uppercase;
}

/* Season sections */
.podcast-section {
  margin-bottom: 56px;
}

.section-title {
  font-family: 'altfont', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  color: #ffe600;
  margin-bottom: 20px;
  border-left: 4px solid #ffe600;
  padding-left: 14px;
}

/* Episodes grid – filmstrip style */
.episodes-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
}

/* Episode card (film frame) */
.episode-card {
  position: relative;
  aspect-ratio: 3 / 4;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.35s ease;
  box-shadow: 
    0 6px 24px rgba(0, 0, 0, 0.7),
    inset 0 0 0 1px rgba(0, 0, 0, 0.03);
}

/* Alternating film frames – desktop */
.episode-card:nth-child(odd) {
  border: 10px solid #000000;
  padding: 6px;
  background: #000000;
}

.episode-card:nth-child(even) {
  border: 10px solid #0a1a3a;
  padding: 6px;
  background: #0a1a3a;
}

.episode-card .cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 6px;
  transition: opacity 0.3s ease, transform 0.5s ease;
  background: #111;
}

.episode-card:hover {
  transform: scale(1.04) translateY(-6px);
  box-shadow: 
    0 16px 40px rgba(0, 0, 0, 0.8),
    0 0 0 1px rgba(255, 230, 0, 0.25),
    0 0 30px rgba(255, 230, 0, 0.12);
}

.episode-card:hover .cover {
  opacity: 0.88;
  transform: scale(1.05);
}

/* Overlay info on card */
.episode-info {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 16px 14px;
  background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.4) 45%, transparent 100%);
  border-radius: 6px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.episode-card:hover .episode-info {
  opacity: 1;
}

.episode-info .date {
  font-size: 11px;
  letter-spacing: 1px;
  color: rgba(255,230,0,0.7);
  margin-bottom: 4px;
}

.episode-info .episode {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 6px;
}

.episode-info .title {
  font-family: 'altfont', sans-serif;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.25;
  color: #fff;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}

.episode-info .action {
  font-size: 12px;
  letter-spacing: 1.5px;
  color: #ffe600;
  font-weight: 700;
}

/* Always-visible mini label (for touch devices) */
.episode-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px 12px 12px;
  background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.episode-card:hover .episode-label {
  opacity: 0;
}

.episode-label .title {
  font-family: 'altfont', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}

/* ================= MODAL ================= */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: #0a0f1a;
  border: 2px solid rgba(255, 230, 0, 0.25);
  border-radius: 16px;
  padding: 32px 28px 28px;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 230, 0, 0.08);
  position: relative;
}

.modal-content h2 {
  font-family: 'altfont', sans-serif;
  font-size: 20px;
  color: #ffe600;
  letter-spacing: 1px;
  margin-bottom: 20px;
  line-height: 1.3;
  padding-right: 40px;
}

#audioPlayer {
  width: 100%;
  margin-bottom: 18px;
  border-radius: 8px;
  outline: none;
}

#videoPlayer {
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 10px;
  margin-bottom: 18px;
  border: none;
  background: #000;
}

.close-btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: transparent;
  border: 1px solid rgba(255, 230, 0, 0.45);
  color: #ffe600;
  font-family: 'altfont', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.25s ease;
}

.close-btn:hover {
  background: rgba(255, 230, 0, 0.12);
  border-color: #ffe600;
}

.modal .close {
  position: absolute;
  top: 16px;
  right: 16px;
  font-size: 28px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #ffe600;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 230, 0, 0.3);
  border-radius: 50%;
  transition: all 0.25s ease;
}

.modal .close:hover {
  background: rgba(255, 230, 0, 0.15);
  transform: scale(1.08);
}

/* ================= FOOTER ================= */
.footer{max-width:1200px;width:100%;margin:20px 0 30px;color:#fff;padding:20px 24px;text-align:left!important;display:block;line-height:1.6;align-self:flex-start}

/* ================= RESPONSIVE ================= */
@media (max-width: 1200px) {
  .episodes-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width: 900px) {
  .episodes-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 768px) {
  .main-content {
    padding: 92px 14px 30px;
  }

  .episodes-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  /* Reset desktop alternating */
  .episode-card:nth-child(odd),
  .episode-card:nth-child(even) {
    border: none;
    padding: 0;
    background: transparent;
  }

  /* Mobile film pattern */
  .episode-card:nth-child(4n+1),
  .episode-card:nth-child(4n) {
    border: 7px solid #000000;
    padding: 4px;
    background: #000000;
    border-radius: 11px;
  }

  .episode-card:nth-child(4n+2),
  .episode-card:nth-child(4n+3) {
    border: 7px solid #0a1a3a;
    padding: 4px;
    background: #0a1a3a;
    border-radius: 11px;
  }

  .top-bar-title {
    font-size: 18px;
    letter-spacing: 2px;
  }

  .podcast-header h1 {
    letter-spacing: 2px;
  }

  .modal-content {
    padding: 24px 20px 20px;
  }
}

@media (max-width: 480px) {
  .episodes-grid {
    gap: 10px;
  }

  .episode-card:nth-child(4n+1),
  .episode-card:nth-child(4n),
  .episode-card:nth-child(4n+2),
  .episode-card:nth-child(4n+3) {
    border-width: 6px;
    padding: 3px;
  }
}

/* Blur effect when modal open */
.main-content.blurred {
  filter: blur(4px);
  pointer-events: none;
}

      {

    ],
    "Season 2": [
      {

      {

      }
    ]
  };

  const gridContainer = document.getElementById("grid-container");
  const mainContent = document.getElementById("mainContent");

  // Render episodes
  Object.keys(episodesData).forEach(season => {
    const section = document.createElement("div");
    section.className = "podcast-section";
    
    const title = document.createElement("h2");
    title.className = "section-title";
    title.textContent = season.toUpperCase();
    section.appendChild(title);
    
    const grid = document.createElement("div");
    grid.className = "episodes-grid";
    
    episodesData[season].forEach(ep => {
      const div = document.createElement("div");
      div.className = "episode-card";
      div.title = `${ep.episodeTitle} – ${ep.podcastName}`;
      
      const cover = ep.coverURL || "images/episode-placeholder.jpg";
      
      div.innerHTML = `
        <img class="cover" src="${cover}" alt="${ep.episodeTitle}" loading="lazy" 
             onerror="this.src='https://via.placeholder.com/400x533/111111/ffe600?text=TREND+TALK'" />
        <div class="episode-info">
          <p class="date">${ep.releaseDate}</p>
          <p class="episode">${ep.season} · Ep. ${ep.episodeNumber}</p>
          <p class="title">${ep.episodeTitle}</p>
          <p class="action">LISTEN →</p>
        </div>
        <div class="episode-label">
          <p class="title">${ep.episodeTitle}</p>
        </div>
      `;
      
      div.addEventListener("click", () => openModal(ep));
      grid.appendChild(div);
    });
    
    section.appendChild(grid);
    gridContainer.appendChild(section);
  });

  // Modal
  const modal = document.getElementById("modal");
  const episodeTitleElem = document.getElementById("episodeTitle");
  const audioPlayer = document.getElementById("audioPlayer");
  const audioSource = document.getElementById("audioSource");
  const videoPlayer = document.getElementById("videoPlayer");

  window.openModal = function(ep) {
    episodeTitleElem.textContent = `${ep.season} – ${ep.episodeTitle} (Ep. ${ep.episodeNumber})`;
    audioSource.src = ep.audioFile || "";
    audioPlayer.load();
    
    if (ep.youtubeURL) {
      videoPlayer.src = ep.youtubeURL;
      videoPlayer.style.display = "block";
    } else {
      videoPlayer.src = "";
      videoPlayer.style.display = "none";
    }
    
    modal.classList.add("open");
    mainContent.classList.add("blurred");
  };

  window.closeModal = function() {
    modal.classList.remove("open");
    audioPlayer.pause();
    audioSource.src = "";
    audioPlayer.load();
    videoPlayer.src = "";
    mainContent.classList.remove("blurred");
  };

  // Sidebar logic
  (function(){
    const sidebar = document.getElementById('siteSidebar');
    const close = sidebar && sidebar.querySelector('.close');
    const menuButtons = Array.from(document.querySelectorAll('.menu-btn'));

    function open(){
      if (!sidebar) return;
      sidebar.classList.add('open');
      document.body.classList.add('menu-open');
      sidebar.setAttribute('aria-hidden','false');
    }

    function closeMenu(){
      if (!sidebar) return;
      sidebar.classList.remove('open');
      document.body.classList.remove('menu-open');
      sidebar.setAttribute('aria-hidden','true');
    }

    menuButtons.forEach(function(btn){
      if (btn) btn.addEventListener('click', open);
    });

    if (close) close.addEventListener('click', closeMenu);

    document.addEventListener('click', function(e){
      if (!sidebar) return;
      const clickedMenuButton = menuButtons.some(function(btn){ return btn && btn.contains(e.target); });
      if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !clickedMenuButton) closeMenu();
    });

    document.addEventListener('keydown', function(e){ 
      if (e.key === 'Escape') {
        closeMenu();
        closeModal();
      }
    });
  })();
</script>
</body>
</html>
